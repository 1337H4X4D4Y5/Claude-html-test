<style>

  #debug.collapsed #copy-btn, #debug.collapsed #reset-btn { display: none; }

  #copy-btn, #reset-btn {

    right: calc(env(safe-area-inset-right, 8px) + 8px);

  #settings-panel.open { display: block; }
  #settings-panel .label { font-size: 11px; opacity: 0.65; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.8px; }
  #settings-panel .count { font-size: 17px; font-weight: 600; margin-bottom: 8px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  #settings-panel input[type=range] { width: 100%; }
  #settings-apply, #settings-cancel {
    appearance: none; -webkit-appearance: none; border: none;

  /* Presets button + panel — same visual language as the gear, sitting

  #presets-btn {

  }

  .preset-btn .preset-desc {

<body>
<canvas id="gpu-canvas"></canvas>
<a id="home-btn" href="./">← Home</a>
<div id="overlay">
  <h1>Water Box (MPM)</h1>
  <p>Material-Point Method fluid on the GPU. Hybrid grid + particle solver. PIC mode for now; MLS-MPM in the next version.</p>
  <button id="start-btn">Tap to begin</button>
  <div id="overlay-msg"></div>
  <div id="overlay-version"></div>
</div>
<div id="fps"></div>
<div id="version"></div>
<button id="settings-btn" title="Settings">⚙</button>
<div id="settings-panel">
  <div class="label">Particles</div>
  <div class="count" id="settings-count">24000</div>
  <input id="settings-slider" type="range" min="1000" max="200000" step="1000" value="24000">
  <div class="label" style="margin-top: 12px;">Box depth</div>
  <div class="count" id="settings-depth-count">0.25</div>
  <input id="settings-depth-slider" type="range" min="0.10" max="1.50" step="0.05" value="0.25">
  <button id="settings-apply">Apply (reloads)</button>
  <button id="settings-cancel">Cancel</button>
</div>
<button id="presets-btn" title="Fluid preset">💧</button>
<div id="presets-panel">
  <div class="label">Fluid preset</div>
  <button class="preset-btn" data-preset="water">Water<span class="preset-desc">balanced, splashy</span></button>
  <button class="preset-btn" data-preset="honey">Honey<span class="preset-desc">slow, sticky, very viscous</span></button>
  <button class="preset-btn" data-preset="syrup">Maple syrup<span class="preset-desc">medium viscous</span></button>
  <button class="preset-btn" data-preset="mercury">Mercury<span class="preset-desc">dense, bouncy, inviscid</span></button>
  <button id="presets-close">Close</button>
</div>
<div id="debug"><div id="debug-text">initialising…</div><button id="copy-btn">Copy debug info</button><button id="reset-btn">Reset particles</button></div>

<script>
// Install a window-level error handler IMMEDIATELY so even errors that
// would otherwise be silent (script load, listener registration, top-level
// throws) become visible on the page. Without this, an iOS Safari script
// error can leave the Tap-to-begin button non-functional with no visible
// indication of why.
(function installErrorBanner() {
  function show(kind, message, source) {
    let el = document.getElementById('error-banner');
    if (!el) {
      el = document.createElement('div');
      el.id = 'error-banner';
      el.style.cssText =
        'position:fixed;top:0;left:0;right:0;z-index:99999;' +
        'background:#7a1f1f;color:#fff;font:13px/1.4 ui-monospace,monospace;' +
        'padding:10px 14px;border-bottom:1px solid #f88;' +
        'white-space:pre-wrap;word-break:break-word;';
      (document.body || document.documentElement).appendChild(el);
    }
    el.textContent = '[' + kind + '] ' + (message || '') + (source ? '\n@ ' + source : '');
  }
  window.addEventListener('error', function (e) {
    show('JS error', (e.error && e.error.message) || e.message,
      e.filename + ':' + e.lineno + ':' + e.colno);
  });
  window.addEventListener('unhandledrejection', function (e) {
    const r = e.reason;
    show('Unhandled rejection', (r && r.message) || String(r));
  });
})();

const APP_VERSION = 'mpm-v67 (2026-05-11 — water settles instead of perpetually sloshing)';
document.getElementById('overlay-version').textContent = APP_VERSION;
document.getElementById('version').textContent = APP_VERSION;

// v50: bump default 8000 → 24000. v57: 40k → 80k. v58: 80k → 200000.
// User still at 60 FPS at 80k so push further. Particle spacing scales
// like (4/N)^(1/3) — N=24k → 0.055, N=80k → 0.037, N=200k → 0.027.
// At N=200k the spacing is below the 0.020 imposter radius — particles
// physically overlap, surface reads as fully continuous fluid.
// Memory: largest buffer is Cmat (N * 48B) = 9.6MB at 200k. Well below
// WebGPU iOS storage-buffer limits (typically 128-256 MB).
function readParticleCount() {
  const m = location.search.match(/[?&]n=(\d+)/);
  if (!m) return 24000;
  return Math.max(500, Math.min(200000, parseInt(m[1], 10) || 24000));
}
const N = readParticleCount();

// v63: user-controllable box depth via ?d=NN URL param + settings slider.
// Min 0.10 (thin phone), max 1.50 (deep tank). Default 0.25.
function readBoxDepth() {
  const m = location.search.match(/[?&]d=(\d+(?:\.\d+)?)/);
  if (!m) return 0.25;
  return Math.max(0.10, Math.min(1.50, parseFloat(m[1]) || 0.25));
}
const BOX_DEPTH_INITIAL = readBoxDepth();

// v60: iPhone 15 Pro Max aspect (159.9 x 76.7 x 8.25 mm) ≈ 1 : 2.083 : 0.108.
// v61: BOX_HALF_X is now updated at run time to canvas aspect * BOX_HALF_Y,
// so the box matches the *user's* phone screen exactly — they're declared
// `let` and the values here are placeholders for the initial preset apply.
// Declared HERE (above _natRho) because _natRho reads them.
let BOX_HALF_X = 0.480;
const BOX_HALF_Y = 1.000;
let BOX_HALF_Z = 0.052;
let GRID_HALF = Math.max(BOX_HALF_X, BOX_HALF_Y, BOX_HALF_Z);
const GRID_SIZE = 48;
const NUM_CELLS = GRID_SIZE * GRID_SIZE * GRID_SIZE;
let CELL_SIZE = (2 * GRID_HALF) / GRID_SIZE;

// All MPM tunables live in one place. Surfaced in the on-screen debug
// strip and the copy-debug report so we can iterate from screenshots.
// CFL pressure-wave constraint: dt < cellSize / sqrt(pressureK / restDensity).
// restDensity scales with N so the EOS balances gravity at modest
// compression no matter what particle count is loaded:
//   rho0 ~ (N * particleMass) / (filled volume)
//   filled volume ~ box_volume / 2  (fluid fills the lower half at rest)
// v60: box is an iPhone-aspect prism so filled_vol is much smaller than
// the old 4-cube but pressureK and restDensity scale together → CFL
// margin unchanged. v61: _natRho is recomputed in initAndRun after the
// canvas aspect drives BOX_HALF_X.
let FILL_VOLUME = 4 * BOX_HALF_X * BOX_HALF_Y * BOX_HALF_Z;
let _natRho = N * 1.0 / FILL_VOLUME;

function recomputeBoxDerived() {
  // v62: grid is 2 cells wider than the box on every face. Why: cs_p2g
  // and cs_g2p early-return when base.* falls outside [0, GRID_SIZE-3].
  // With the previous gridHalf = max(boxHalf), a particle clamped to
  // p.y = boxHalfY - 0.01 had base.y = -1 in the next frame's gather
  // and the particle never updated again — visually, fluid that hit
  // the floor got "stuck below the screen". Margin formula:
  //   gridHalf = max(box) * GRID_SIZE / (GRID_SIZE - 4)
  // gives exactly 2 cells of padding on each end so any in-box position
  // maps to a valid base index.
  const maxHalf = Math.max(BOX_HALF_X, BOX_HALF_Y, BOX_HALF_Z);
  GRID_HALF = maxHalf * GRID_SIZE / (GRID_SIZE - 4);
  CELL_SIZE = (2 * GRID_HALF) / GRID_SIZE;
  FILL_VOLUME = 4 * BOX_HALF_X * BOX_HALF_Y * BOX_HALF_Z;
  _natRho = N * 1.0 / FILL_VOLUME;
}

// v51: fluid styles. Each preset overrides the live-tunable subset of
// SIM_TUNE — pressureK / damping / restitution / wallFriction / viscosity /
// maxAccel — no reload required because simBuf is rewritten every frame.
// Fields not in `tune` (restDensity, particleMass, eos) stay shared so
// the EOS shape and per-particle mass don't shift between presets.
// v56: each preset now carries its visual identity too — base colour (the
// transmitted hue at zero thickness) and per-channel Beer's law extinction
// coefficients (which channel dies fastest as thickness grows).
//
//   Water:    light cyan -> deep blue at depth   (red dies first)
//   Honey:    amber      -> dark amber at depth  (blue dies first)
//   Syrup:    orange     -> dark brown at depth  (blue + green absorbed)
//   Mercury:  silver     -> nearly opaque        (all channels absorb hard)
// v61: presets store pressureKMul (multiplier over _natRho) instead of the
// already-multiplied pressureK literal. _natRho depends on box volume,
// which depends on canvas aspect (v61), so it's only known after the
// canvas is sized. applyPreset() multiplies by the current _natRho.
const FLUID_PRESETS = [
  {
    key: 'water', label: 'Water',
    tune: {
      // v67: water wasn't settling — pressure oscillations bounced inside
      // the box faster than damping could kill them. Soften K, increase
      // per-step damping, slightly stickier walls. Each individual change
      // is small (still well below the "goopy" honey preset) but together
      // they damp the residual sloshing within ~2 seconds.
      pressureKMul: 35, velDamping: 0.993, restitution: 0.0,
      wallFriction: 0.93, viscosity: 0.008, maxAccel: 40.0,
      baseColorR: 0.45, baseColorG: 0.78, baseColorB: 0.92,
      absorptionR: 5.0, absorptionG: 2.5, absorptionB: 0.8,
      // v59: screen-space refraction strength in pixels.
      refractStrength: 35.0,
    },
  },
  {
    key: 'honey', label: 'Honey',
    tune: {
      // Soft K + heavy damping + sticky walls + very high XSPH viscosity.
      pressureKMul: 30, velDamping: 0.985, restitution: 0.05,
      wallFriction: 0.75, viscosity: 0.20, maxAccel: 25.0,
      baseColorR: 1.00, baseColorG: 0.78, baseColorB: 0.32,
      absorptionR: 0.6, absorptionG: 1.8, absorptionB: 6.0,
      refractStrength: 22.0,
    },
  },
  {
    key: 'syrup', label: 'Maple syrup',
    tune: {
      pressureKMul: 40, velDamping: 0.993, restitution: 0.10,
      wallFriction: 0.85, viscosity: 0.10, maxAccel: 40.0,
      baseColorR: 0.85, baseColorG: 0.48, baseColorB: 0.18,
      absorptionR: 1.5, absorptionG: 3.5, absorptionB: 8.0,
      refractStrength: 18.0,
    },
  },
  {
    key: 'mercury', label: 'Mercury',
    tune: {
      // Stiffer K (still inside CFL — c=8.94, margin 1.68x), almost-zero
      // viscosity, nearly-free slip, big bounce. Reads as a dense metal.
      pressureKMul: 80, velDamping: 0.9995, restitution: 0.40,
      wallFriction: 0.99, viscosity: 0.002, maxAccel: 120.0,
      baseColorR: 0.85, baseColorG: 0.88, baseColorB: 0.95,
      absorptionR: 8.0, absorptionG: 8.0, absorptionB: 8.0,
      // Metal — barely refracts.
      refractStrength: 4.0,
    },
  },
];
function findPreset(key) {
  for (const p of FLUID_PRESETS) { if (p.key === key) return p; }
  return null;
}
const DEFAULT_PRESET = 'water';

const SIM_TUNE = {
  // Shared, not in any preset.
  particleMass: 1.0,
  eos: 'linear',
  // Filled in by applyPreset() below.
  restDensity: _natRho,
  pressureK: 0,
  pressureKMul: 0,
  velDamping: 0, restitution: 0, wallFriction: 0, viscosity: 0, maxAccel: 0,
  baseColorR: 0, baseColorG: 0, baseColorB: 0,
  absorptionR: 0, absorptionG: 0, absorptionB: 0,
  refractStrength: 0,
};
// v61: applyPreset translates pressureKMul -> pressureK using the current
// _natRho (which depends on box volume, set in initAndRun). Also refreshes
// SIM_TUNE.restDensity so it tracks any box-aspect change.
function applyPreset(key) {
  const p = findPreset(key);
  if (!p) return;
  for (const k in p.tune) { SIM_TUNE[k] = p.tune[k]; }
  // Derived from box volume (must run AFTER recomputeBoxDerived()).
  SIM_TUNE.restDensity = _natRho;
  SIM_TUNE.pressureK   = SIM_TUNE.pressureKMul * _natRho;
  if (typeof state !== 'undefined') {
    state.preset = p.key;
    state.presetLabel = p.label;
  }
  if (typeof updateDebug === 'function') updateDebug();
  const btns = document.querySelectorAll('.preset-btn');
  for (const b of btns) {
    b.classList.toggle('active', b.getAttribute('data-preset') === key);
  }
}
// (Box + grid constants now declared above, next to readParticleCount, so
// _natRho can read BOX_HALF_X without TDZ. v52: 32 → 48 grid, 3.375x more
// cells (32^3=32768 → 48^3=110592). cs_clearGrid and cs_grid scale with
// cell count; P2G/G2P stay particle-bound.)
// v50: 0.014 → 0.020. At v49's N=8000 and r=0.014, average inter-particle
// distance (~0.079) was ~5.6x the radius and you could see daylight between
// particles. New default is N=24000 (spacing ~0.055) with radius 0.020 →
// ratio drops to 2.7x, so the SSF bilateral blur bridges neighbours into
// one continuous surface. Still well below v33's "bubble sphere" 0.030.
const PARTICLE_RADIUS = 0.020;
// Fixed-point scale for atomicAdd into i32 storage. iOS WebGPU has no
// atomic<f32>, so each float value is encoded as round(v * SCALE) and
// decoded after the P2G pass by dividing back.
const FIXED_POINT = 1.0e6;

const overlay = document.getElementById('overlay');
const overlayMsg = document.getElementById('overlay-msg');
const startBtn = document.getElementById('start-btn');
const fpsEl = document.getElementById('fps');
const debugTextEl = document.getElementById('debug-text');
const copyBtn = document.getElementById('copy-btn');

const state = {
  gyroPermission: 'unknown',
  events: 0,
  beta: 0, gamma: 0,
  gravity: { x: 0, y: -9.8, z: 0 },
  target: { x: 0, y: -9.8, z: 0 },
  fps: 0, steps: 0,
  initError: null, gpuError: null,
  preset: DEFAULT_PRESET, presetLabel: findPreset(DEFAULT_PRESET).label,
};

const DEG = Math.PI / 180;
function mapOrientationToGravity(beta, gamma, screenAngle, magnitude) {
  const b = (beta || 0) * DEG, g = (gamma || 0) * DEG;
  const cb = Math.cos(b), sb = Math.sin(b);
  const cg = Math.cos(g), sg = Math.sin(g);
  const gxDev =  cb * sg;
  const gyDev = -sb;
  const gzDev = -cb * cg;
  const o = (screenAngle || 0) * DEG;
  const co = Math.cos(o), so = Math.sin(o);
  const rx =  co * gxDev + so * gyDev;
  const ry = -so * gxDev + co * gyDev;
  const rz = gzDev;
  const m = Math.hypot(rx, ry, rz);
  const mag = m < 1e-6 ? 1 : m;
  const s = magnitude / mag;
  return { x: rx * s, y: ry * s, z: rz * s };
}

function onOrientation(e) {
  state.events++;

}

// ===========================================================================
// MPM compute shaders. Three kernels per substep:
//   cs_clearGrid : zero out the grid mass + momentum buffers.
//   cs_p2g       : scatter each particle's mass + momentum to its 8
//                  surrounding grid nodes (trilinear B-spline). atomicAdd
//                  into i32 fixed-point because WebGPU has no atomic<f32>.
//   cs_grid      : per cell, decode fixed-point, divide momentum/mass for
//                  velocity, add gravity*dt, apply wall boundaries.
//   cs_g2p       : each particle gathers velocity from its 8 grid nodes
//                  (trilinear B-spline), uses that as new velocity, then
//                  advects position. This is plain PIC — dissipative but
//                  stable. v40 will upgrade to MLS-MPM (quadratic B-spline,
//                  affine C matrix) for sharper fluid feel.
// ===========================================================================
const WGSL_COMPUTE = `
// v60: boxHalfX/Y/Z + gridHalf replaced the scalar boxHalf so the box
// can be a non-cubic prism (iPhone aspect). gridHalf is the largest of
// the three; the cubic grid is sized for gridHalf, and box bounds are
// used for wall BCs and particle clamping.
struct SimParams {
  gravity: vec3<f32>,
  dt: f32,
  boxHalfX: f32,
  boxHalfY: f32,
  boxHalfZ: f32,
  gridHalf: f32,
  cellSize: f32,
  invCellSize: f32,
  fixedPoint: f32,
  particleMass: f32,
  velDamping: f32,
  restitution: f32,
  pressureK: f32,
  restDensity: f32,
  maxAccel: f32,
  wallFriction: f32,
  viscosity: f32,
};

const N: u32 = ${N}u;
const GRID_SIZE: u32 = ${GRID_SIZE}u;
const NUM_CELLS: u32 = ${NUM_CELLS}u;

@group(0) @binding(0) var<storage, read_write> pos: array<vec4<f32>>;
@group(0) @binding(1) var<storage, read_write> vel: array<vec4<f32>>;
@group(0) @binding(2) var<storage, read_write> grid: array<atomic<i32>>;
@group(0) @binding(3) var<storage, read_write> gridVel: array<vec4<f32>>;
@group(0) @binding(4) var<uniform> P: SimParams;
// Per-particle affine velocity gradient (APIC C matrix). 3x3 stored as
// mat3x3<f32> (48 bytes per particle).
@group(0) @binding(5) var<storage, read_write> Cmat: array<mat3x3<f32>>;

fn cellIndex(ix: u32, iy: u32, iz: u32) -> u32 {
  return ix + GRID_SIZE * (iy + GRID_SIZE * iz);
}

// Quadratic B-spline weights. fx is the particle's fractional position
// relative to (base + 0.5) of its 3-cell window.
fn quadWeights(fx: vec3<f32>) -> array<vec3<f32>, 3> {
  let a = vec3<f32>(1.5) - fx;
  let b = fx - vec3<f32>(1.0);
  let c = fx - vec3<f32>(0.5);
  var w: array<vec3<f32>, 3>;
  w[0] = 0.5 * a * a;
  w[1] = vec3<f32>(0.75) - b * b;
  w[2] = 0.5 * c * c;
  return w;
}

// Outer product a (column) * b^T -> mat3x3. column j = a * b[j].
fn outerProd(a: vec3<f32>, b: vec3<f32>) -> mat3x3<f32> {
  return mat3x3<f32>(a * b.x, a * b.y, a * b.z);
}

// LINEAR equation-of-state pressure at a grid cell.
// P = K * max(0, rho/rho0 - 1).
// v41 used Tait (ratio^7 - 1) which is the textbook choice for water but
// way too sharp for the CFL-limited stiffness our timestep can support
// — a 2x compression gave 128x pressure, blasted everything to the walls.
// Linear keeps pressure proportional to compression so the response stays
// in a sane range.
fn samplePressure(ix: i32, iy: i32, iz: i32) -> f32 {
  if (ix < 0 || ix >= i32(GRID_SIZE)) { return 0.0; }
  if (iy < 0 || iy >= i32(GRID_SIZE)) { return 0.0; }
  if (iz < 0 || iz >= i32(GRID_SIZE)) { return 0.0; }
  let c = cellIndex(u32(ix), u32(iy), u32(iz));
  let m = f32(atomicLoad(&grid[c * 4u + 0u])) / P.fixedPoint;
  let cv = P.cellSize * P.cellSize * P.cellSize;
  let r = m / cv;
  if (r <= P.restDensity) { return 0.0; }
  return P.pressureK * (r / P.restDensity - 1.0);
}

@compute @workgroup_size(64)
fn cs_clearGrid(@builtin(global_invocation_id) gid: vec3<u32>) {
  let i = gid.x;
  if (i >= NUM_CELLS) { return; }
  let b = i * 4u;
  atomicStore(&grid[b + 0u], 0);
  atomicStore(&grid[b + 1u], 0);
  atomicStore(&grid[b + 2u], 0);
  atomicStore(&grid[b + 3u], 0);
}

// Particle-to-Grid (APIC / MLS-MPM). Each particle scatters to its 27
// surrounding nodes weighted by a quadratic B-spline. The momentum
// contribution includes an affine term (C * (node_pos - particle_pos))
// so the velocity field reconstructed on the grid carries information
// about the particle's local velocity gradient — much less dissipative
// than vanilla PIC, and the key reason MLS-MPM water can sustain swirls.
@compute @workgroup_size(64)
fn cs_p2g(@builtin(global_invocation_id) gid: vec3<u32>) {
  let i = gid.x;
  if (i >= N) { return; }
  let p = pos[i].xyz;
  let v = vel[i].xyz;
  let C = Cmat[i];
  // v60: grid is cubic spanning ±gridHalf; box bounds are inside this.
  let h = P.gridHalf;
  let inv = P.invCellSize;
  let gp = (p + vec3<f32>(h)) * inv;
  let base = vec3<i32>(floor(gp - vec3<f32>(0.5)));
  if (base.x < 0 || base.x >= i32(GRID_SIZE) - 2 ||
      base.y < 0 || base.y >= i32(GRID_SIZE) - 2 ||
      base.z < 0 || base.z >= i32(GRID_SIZE) - 2) {
    return;
  }
  let fx = gp - vec3<f32>(base);    // in [0.5, 1.5]
  let w = quadWeights(fx);
  let m = P.particleMass;
  let scale = P.fixedPoint;
  for (var oz: u32 = 0u; oz < 3u; oz = oz + 1u) {
    let wzv = w[oz].z;
    for (var oy: u32 = 0u; oy < 3u; oy = oy + 1u) {
      let wyv = w[oy].y;
      for (var ox: u32 = 0u; ox < 3u; ox = ox + 1u) {
        let wxv = w[ox].x;
        let weight = wxv * wyv * wzv;
        if (weight <= 0.0) { continue; }
        let ci = cellIndex(u32(base.x) + ox, u32(base.y) + oy, u32(base.z) + oz);
        // World position of this grid node, in metres (scene units).
        let nodeWorld = vec3<f32>(f32(base.x + i32(ox)), f32(base.y + i32(oy)), f32(base.z + i32(oz))) * P.cellSize - vec3<f32>(h);
        let dpos = nodeWorld - p;
        // Affine velocity at the node = v + C * dpos.
        let vAtNode = v + C * dpos;
        let mw = m * weight;
        atomicAdd(&grid[ci * 4u + 0u], i32(mw * scale));
        atomicAdd(&grid[ci * 4u + 1u], i32(mw * vAtNode.x * scale));
        atomicAdd(&grid[ci * 4u + 2u], i32(mw * vAtNode.y * scale));
        atomicAdd(&grid[ci * 4u + 3u], i32(mw * vAtNode.z * scale));
      }
    }
  }
}

@compute @workgroup_size(64)
fn cs_grid(@builtin(global_invocation_id) gid: vec3<u32>) {
  let ci = gid.x;
  if (ci >= NUM_CELLS) { return; }
  let b = ci * 4u;
  let invS = 1.0 / P.fixedPoint;
  let mass = f32(atomicLoad(&grid[b + 0u])) * invS;
  if (mass <= 1e-6) {
    gridVel[ci] = vec4<f32>(0.0);
    return;
  }
  var v = vec3<f32>(
    f32(atomicLoad(&grid[b + 1u])) * invS,
    f32(atomicLoad(&grid[b + 2u])) * invS,
    f32(atomicLoad(&grid[b + 3u])) * invS
  ) / mass;
  // Cell coordinates for neighbour lookups.
  let iz = ci / (GRID_SIZE * GRID_SIZE);
  let rem = ci - iz * GRID_SIZE * GRID_SIZE;
  let iy = rem / GRID_SIZE;
  let ix = rem - iy * GRID_SIZE;

  // Gravity (body force).
  v = v + P.gravity * P.dt;

  // Pressure gradient force. Sample the Tait pressure at this cell's 6
  // axis-aligned neighbours, build the central-difference gradient,
  // accelerate by -gradP/rho. This is what gives the fluid its
  // incompressibility — overcompressed regions push velocity outward.
  let pXp = samplePressure(i32(ix) + 1, i32(iy), i32(iz));
  let pXm = samplePressure(i32(ix) - 1, i32(iy), i32(iz));
  let pYp = samplePressure(i32(ix), i32(iy) + 1, i32(iz));
  let pYm = samplePressure(i32(ix), i32(iy) - 1, i32(iz));
  let pZp = samplePressure(i32(ix), i32(iy), i32(iz) + 1);
  let pZm = samplePressure(i32(ix), i32(iy), i32(iz) - 1);
  let gradP = vec3<f32>(
    (pXp - pXm) * 0.5 * P.invCellSize,
    (pYp - pYm) * 0.5 * P.invCellSize,
    (pZp - pZm) * 0.5 * P.invCellSize
  );
  let cellVolume = P.cellSize * P.cellSize * P.cellSize;
  let rho = mass / cellVolume;
  var accel = -gradP / rho;
  // Clamp pressure acceleration to P.maxAccel — surfaced as a tunable
  // because a single under-resolved cell can briefly read a huge
  // density spike and fire its neighbours away (v41 wall-blast bug).
  let aMag = length(accel);
  if (aMag > P.maxAccel) { accel = accel * (P.maxAccel / aMag); }
  v = v + accel * P.dt;

  // Wall boundary: clamp normal velocity for cells on the inside face of
  // the box walls, then damp tangential velocity by wallFriction
  // (partial-slip BC). v60: walls are at ±boxHalfX/Y/Z which may be
  // strictly inside the cubic grid, so detect by world position rather
  // than grid edge index. The "boundary band" is one cell thick — the
  // cell whose centre is just inside the wall.
  let cellWorldX = (f32(ix) + 0.5) * P.cellSize - P.gridHalf;
  let cellWorldY = (f32(iy) + 0.5) * P.cellSize - P.gridHalf;
  let cellWorldZ = (f32(iz) + 0.5) * P.cellSize - P.gridHalf;
  let band = P.cellSize * 1.5;
  let atXmin = cellWorldX < -P.boxHalfX + band;
  let atXmax = cellWorldX >  P.boxHalfX - band;
  let atYmin = cellWorldY < -P.boxHalfY + band;
  let atYmax = cellWorldY >  P.boxHalfY - band;
  let atZmin = cellWorldZ < -P.boxHalfZ + band;
  let atZmax = cellWorldZ >  P.boxHalfZ - band;
  if (atXmin && v.x < 0.0) { v.x = 0.0; }
  if (atXmax && v.x > 0.0) { v.x = 0.0; }
  if (atYmin && v.y < 0.0) { v.y = 0.0; }
  if (atYmax && v.y > 0.0) { v.y = 0.0; }
  if (atZmin && v.z < 0.0) { v.z = 0.0; }
  if (atZmax && v.z > 0.0) { v.z = 0.0; }
  let f = P.wallFriction;
  if (atXmin || atXmax) { v.y = v.y * f; v.z = v.z * f; }
  if (atYmin || atYmax) { v.x = v.x * f; v.z = v.z * f; }
  if (atZmin || atZmax) { v.x = v.x * f; v.y = v.y * f; }

  gridVel[ci] = vec4<f32>(v, mass);
}

// Grid-to-Particle. Quadratic B-spline gather over 27 nodes. Reconstruct
// the affine matrix C via the MLS formula: C = (4/dx²) * Σ w_i v_i (x_i - x_p)^T.
@compute @workgroup_size(64)
fn cs_g2p(@builtin(global_invocation_id) gid: vec3<u32>) {
  let i = gid.x;
  if (i >= N) { return; }
  var p = pos[i].xyz;
  // v60: grid mapping uses gridHalf (cubic grid); wall clamps use boxHalf*.
  let h = P.gridHalf;
  let inv = P.invCellSize;
  let gp = (p + vec3<f32>(h)) * inv;
  let base = vec3<i32>(floor(gp - vec3<f32>(0.5)));
  if (base.x < 0 || base.x >= i32(GRID_SIZE) - 2 ||
      base.y < 0 || base.y >= i32(GRID_SIZE) - 2 ||
      base.z < 0 || base.z >= i32(GRID_SIZE) - 2) {
    return;
  }
  let fx = gp - vec3<f32>(base);
  let w = quadWeights(fx);
  var newV = vec3<f32>(0.0);
  // Accumulate Σ w_i v_i (x_i - x_p)^T as a 3x3 matrix.
  var newC = mat3x3<f32>(vec3<f32>(0.0), vec3<f32>(0.0), vec3<f32>(0.0));
  for (var oz: u32 = 0u; oz < 3u; oz = oz + 1u) {
    let wzv = w[oz].z;
    for (var oy: u32 = 0u; oy < 3u; oy = oy + 1u) {
      let wyv = w[oy].y;
      for (var ox: u32 = 0u; ox < 3u; ox = ox + 1u) {
        let wxv = w[ox].x;
        let weight = wxv * wyv * wzv;
        let ci = cellIndex(u32(base.x) + ox, u32(base.y) + oy, u32(base.z) + oz);
        let vi = gridVel[ci].xyz;
        let nodeWorld = vec3<f32>(f32(base.x + i32(ox)), f32(base.y + i32(oy)), f32(base.z + i32(oz))) * P.cellSize - vec3<f32>(h);
        let dpos = nodeWorld - p;
        newV = newV + vi * weight;
        // outer(v_i * weight, dpos)
        newC = newC + outerProd(vi * weight, dpos);
      }
    }
  }
  // MLS reconstruction: scale by 4/dx² (inverse of the second moment of
  // the quadratic B-spline). This is the 'MLS' in MLS-MPM.
  newC = newC * (4.0 * P.invCellSize * P.invCellSize);

  // v48: XSPH-style viscosity. Decay the APIC affine matrix each substep.
  // Inviscid MLS-MPM preserves the velocity gradient through scatter/gather,
  // which makes the fluid almost lossless — splashes shed long thin
  // fingers. Damping C by (1 - viscosity) per substep removes the spin
  // and shear, giving a more cohesive 'water has surface tension' feel
  // without losing the bulk velocity field.
  newC = newC * (1.0 - P.viscosity);

  // Apply small global damping and advect.
  newV = newV * P.velDamping;
  p = p + newV * P.dt;
  // v60: per-axis box bounds (iPhone aspect — much thinner in z than y).
  let limitX = P.boxHalfX - 0.01;
  let limitY = P.boxHalfY - 0.01;
  let limitZ = P.boxHalfZ - 0.01;
  if (p.x < -limitX) { p.x = -limitX; newV.x = -newV.x * P.restitution; }
  if (p.x >  limitX) { p.x =  limitX; newV.x = -newV.x * P.restitution; }
  if (p.y < -limitY) { p.y = -limitY; newV.y = -newV.y * P.restitution; }
  if (p.y >  limitY) { p.y =  limitY; newV.y = -newV.y * P.restitution; }
  if (p.z < -limitZ) { p.z = -limitZ; newV.z = -newV.z * P.restitution; }
  if (p.z >  limitZ) { p.z =  limitZ; newV.z = -newV.z * P.restitution; }

  pos[i] = vec4<f32>(p, 0.0);
  vel[i] = vec4<f32>(newV, 0.0);
  Cmat[i] = newC;
}
`;

// ===========================================================================
// Rendering: same SSF pipeline as gpu.html. Particle depth → bilateral
// blur → composite (Lambert + Fresnel) → wireframe.
// ===========================================================================
const WGSL_DEPTH = `
struct RenderParams {
  viewProj: mat4x4<f32>,
  cameraRight: vec3<f32>,
  particleSize: f32,
  cameraUp: vec3<f32>,
  alphaScale: f32,
};

@group(0) @binding(0) var<storage, read> pos: array<vec4<f32>>;
@group(0) @binding(1) var<uniform> R: RenderParams;

struct VOut {
  @builtin(position) position: vec4<f32>,
  @location(0) uv: vec2<f32>,
};

@vertex
fn vs_main(@builtin(vertex_index) vi: u32,
           @builtin(instance_index) ii: u32) -> VOut {
  var quad = array<vec2<f32>, 6>(
    vec2<f32>(-1.0, -1.0), vec2<f32>( 1.0, -1.0), vec2<f32>(-1.0,  1.0),
    vec2<f32>( 1.0, -1.0), vec2<f32>( 1.0,  1.0), vec2<f32>(-1.0,  1.0)
  );
  let q = quad[vi];
  let center = pos[ii].xyz;
  let wp = center + (R.cameraRight * q.x + R.cameraUp * q.y) * R.particleSize;
  var out: VOut;
  out.position = R.viewProj * vec4<f32>(wp, 1.0);
  out.uv = q;
  return out;
}

@fragment
fn fs_main(in: VOut) -> @builtin(frag_depth) f32 {
  let r2 = dot(in.uv, in.uv);
  if (r2 > 1.0) { discard; }
  let viewZcenter = -1.0 / in.position.w;
  let viewZ = viewZcenter + R.particleSize * sqrt(1.0 - r2);
  let near: f32 = 0.1;
  let far: f32 = 100.0;
  let d = -viewZ;
  if (d <= near) { return 0.0; }
  return (1.0 - near / d) * far / (far - near);
}
`;

// v53: thickness pass. Same billboard vertex layout as the depth pass, but
// the fragment writes a smooth falloff value to a single-channel color
// target with additive blending. The accumulated total per pixel is a
// view-ray integrated "thickness" of fluid in front of the camera —
// exactly the quantity Beer's law (the composite shader) needs to tint
// water by depth (deep parts darker / more blue, shallow parts clearer).
const WGSL_THICKNESS = `
struct RenderParams {
  viewProj: mat4x4<f32>,
  cameraRight: vec3<f32>, particleSize: f32,
  cameraUp: vec3<f32>, alphaScale: f32,
};

@group(0) @binding(0) var<storage, read> pos: array<vec4<f32>>;
@group(0) @binding(1) var<uniform> R: RenderParams;

struct VOut {
  @builtin(position) position: vec4<f32>,
  @location(0) uv: vec2<f32>,
};

@vertex
fn vs_main(@builtin(vertex_index) vi: u32,
           @builtin(instance_index) ii: u32) -> VOut {
  var quad = array<vec2<f32>, 6>(
    vec2<f32>(-1.0, -1.0), vec2<f32>( 1.0, -1.0), vec2<f32>(-1.0,  1.0),
    vec2<f32>( 1.0, -1.0), vec2<f32>( 1.0,  1.0), vec2<f32>(-1.0,  1.0)
  );
  let q = quad[vi];
  let center = pos[ii].xyz;
  let wp = center + (R.cameraRight * q.x + R.cameraUp * q.y) * R.particleSize;
  var out: VOut;
  out.position = R.viewProj * vec4<f32>(wp, 1.0);
  out.uv = q;
  return out;
}

@fragment
fn fs_main(in: VOut) -> @location(0) vec4<f32> {
  let r2 = dot(in.uv, in.uv);
  if (r2 > 1.0) { discard; }
  // Smooth falloff (1 - r^2). Integrated area = pi/2 per particle, so each
  // accumulated pixel is a rough proxy for the number of particles whose
  // imposter overlaps it weighted by closeness to centre.
  let t = (1.0 - r2) * R.alphaScale;
  return vec4<f32>(t, 0.0, 0.0, 0.0);
}
`;

const WGSL_BLUR = `
@group(0) @binding(0) var srcDepth: texture_depth_2d;

@vertex
fn vs_main(@builtin(vertex_index) vi: u32) -> @builtin(position) vec4<f32> {
  var p = array<vec2<f32>, 3>(
    vec2<f32>(-1.0, -1.0), vec2<f32>( 3.0, -1.0), vec2<f32>(-1.0,  3.0)
  );
  return vec4<f32>(p[vi], 0.0, 1.0);
}

fn blur1D(coord: vec2<i32>, dir: vec2<i32>) -> f32 {
  let center = textureLoad(srcDepth, coord, 0);
  if (center >= 0.99999) { return 1.0; }
  let R: i32 = 12;
  let depthThresh: f32 = 0.025;
  let sigma2_inv: f32 = 1.0 / 50.0;
  var sum: f32 = center;
  var totalW: f32 = 1.0;
  for (var i: i32 = 1; i <= R; i = i + 1) {
    let w = exp(-f32(i * i) * sigma2_inv);
    let cR = coord + dir * i;
    let sR = textureLoad(srcDepth, cR, 0);
    if (sR < 0.99999 && abs(sR - center) < depthThresh) {
      sum = sum + sR * w; totalW = totalW + w;
    }
    let cL = coord - dir * i;
    let sL = textureLoad(srcDepth, cL, 0);
    if (sL < 0.99999 && abs(sL - center) < depthThresh) {
      sum = sum + sL * w; totalW = totalW + w;
    }
  }
  return sum / totalW;
}

@fragment
fn fs_h(@builtin(position) frag: vec4<f32>) -> @builtin(frag_depth) f32 {
  return blur1D(vec2<i32>(i32(frag.x), i32(frag.y)), vec2<i32>(1, 0));
}
@fragment
fn fs_v(@builtin(position) frag: vec4<f32>) -> @builtin(frag_depth) f32 {
  return blur1D(vec2<i32>(i32(frag.x), i32(frag.y)), vec2<i32>(0, 1));
}
`;

const WGSL_COMPOSITE = `
struct CompositeParams {
  near: f32, far: f32, fAspect: f32, fVert: f32,
  resolutionX: f32, resolutionY: f32, thicknessScale: f32, refractStrength: f32,
  lightDirX: f32, lightDirY: f32, lightDirZ: f32, _pad1: f32,
  absorptionR: f32, absorptionG: f32, absorptionB: f32, _pad2: f32,
  baseColorR: f32, baseColorG: f32, baseColorB: f32, _pad3: f32,
};

@group(0) @binding(0) var depthTex: texture_depth_2d;
@group(0) @binding(1) var<uniform> P: CompositeParams;
@group(0) @binding(2) var thicknessTex: texture_2d<f32>;
@group(0) @binding(3) var backgroundTex: texture_2d<f32>;

@vertex
fn vs_main(@builtin(vertex_index) vi: u32) -> @builtin(position) vec4<f32> {
  var p = array<vec2<f32>, 3>(
    vec2<f32>(-1.0, -1.0), vec2<f32>( 3.0, -1.0), vec2<f32>(-1.0,  3.0)
  );
  return vec4<f32>(p[vi], 0.0, 1.0);
}

fn viewPosFromDepth(fragXY: vec2<f32>, depth: f32) -> vec3<f32> {
  let ndcX = (fragXY.x / P.resolutionX) * 2.0 - 1.0;
  let ndcY = 1.0 - (fragXY.y / P.resolutionY) * 2.0;
  let viewZ = P.near * P.far / (depth * (P.far - P.near) - P.far);
  let viewX = -ndcX * viewZ / P.fAspect;
  let viewY = -ndcY * viewZ / P.fVert;
  return vec3<f32>(viewX, viewY, viewZ);
}

// Procedural three-stop sky gradient (view-space Y). Used by the Fresnel
// reflection on the water surface so the highlight roll-off looks like
// the room reflected in real water instead of a constant blue rim.
fn sampleSky(dir: vec3<f32>) -> vec3<f32> {
  let zenith  = vec3<f32>(0.55, 0.72, 1.00);
  let horizon = vec3<f32>(0.45, 0.58, 0.78);
  let ground  = vec3<f32>(0.10, 0.14, 0.22);
  let downT = smoothstep(-0.4, 0.0, dir.y);
  let upT   = smoothstep( 0.0, 0.6, dir.y);
  return mix(ground, mix(horizon, zenith, upT), downT);
}

@fragment
fn fs_main(@builtin(position) frag: vec4<f32>) -> @location(0) vec4<f32> {
  let coord = vec2<i32>(i32(frag.x), i32(frag.y));
  let depth = textureLoad(depthTex, coord, 0);
  // v59: where there's no fluid, output the background straight through so
  // the wireframe and clear colour are still visible.
  if (depth >= 0.99999) {
    return vec4<f32>(textureLoad(backgroundTex, coord, 0).rgb, 1.0);
  }

  let viewPos = viewPosFromDepth(frag.xy, depth);
  let ddx_p = dpdx(viewPos);
  let ddy_p = dpdy(viewPos);
  let n = normalize(cross(ddy_p, ddx_p));
  let viewDir = -normalize(viewPos);
  let lightDir = normalize(vec3<f32>(P.lightDirX, P.lightDirY, P.lightDirZ));
  let halfDir = normalize(viewDir + lightDir);

  let diffuse = max(0.0, dot(n, lightDir));
  let spec = pow(max(0.0, dot(n, halfDir)), 96.0);
  let nv = max(0.0, dot(n, viewDir));
  // Sharper Fresnel curve — water has a strong glancing-angle reflection.
  let fresnel = pow(1.0 - nv, 4.0);

  // Beer's law absorption. Thickness is sampled from the additive thickness
  // pass (in front of this fragment) and scaled to absorption units.
  // exp(-coef * thickness) is per-channel: red dies fastest, blue lasts
  // longest → water naturally tints toward deep blue as thickness grows.
  let thicknessRaw = textureLoad(thicknessTex, coord, 0).r;
  let thickness = thicknessRaw * P.thicknessScale;
  let absorption = vec3<f32>(
    exp(-P.absorptionR * thickness),
    exp(-P.absorptionG * thickness),
    exp(-P.absorptionB * thickness)
  );
  // v59: screen-space refraction. Sample the background texture (box
  // wireframe + clear colour) at a UV warped by the surface normal so
  // the lines behind the fluid appear bent. Pure pixel-offset hack —
  // not a real IOR but visually convincing for thin fluid surfaces.
  let warpX = i32(n.x * P.refractStrength);
  let warpY = i32(-n.y * P.refractStrength);
  let bgX = clamp(coord.x + warpX, 0, i32(P.resolutionX) - 1);
  let bgY = clamp(coord.y + warpY, 0, i32(P.resolutionY) - 1);
  let bg = textureLoad(backgroundTex, vec2<i32>(bgX, bgY), 0).rgb;

  // Per-preset base colour. v60: switched from component-wise mixing to
  // a uniform-opacity lerp because the previous formula
  //   bg*absorption + baseColor*(1 - absorption)
  // multiplied baseColor by (1 - absorption) per channel — i.e. by the
  // *absorbed* (short-lived) channels — which biased the visible body
  // toward those channels. For water (red dies first), that pulled the
  // body toward red+green ≈ green. The fix: blend bg vs baseColor with a
  // single scalar so baseColor keeps its hue.
  let baseColor = vec3<f32>(P.baseColorR, P.baseColorG, P.baseColorB);
  let litBase = baseColor * (0.30 + 0.70 * diffuse);
  let avgAbsorb = (absorption.r + absorption.g + absorption.b) * (1.0 / 3.0);
  let opacity = 1.0 - avgAbsorb;
  let absorbedBg = bg * absorption;
  let transmitted = mix(absorbedBg, litBase, opacity);

  // Sky reflection sampled by the reflected view ray. In view space the
  // camera looks down -Z and "up" is +Y; reflectedV.y picks the right
  // stop of the gradient.
  let reflectedV = reflect(-viewDir, n);
  let sky = sampleSky(reflectedV);

  // Composite: refracted/absorbed body blended toward sky reflection by
  // Fresnel, plus a tight specular highlight on top.
  let outColor = mix(transmitted, sky, fresnel) + vec3<f32>(0.95, 0.98, 1.0) * spec * 0.55;
  return vec4<f32>(outColor, 1.0);
}
`;

const WGSL_LINES = `
struct RenderParams {
  viewProj: mat4x4<f32>,
  cameraRight: vec3<f32>, particleSize: f32,
  cameraUp: vec3<f32>, alphaScale: f32,
};
@group(0) @binding(0) var<uniform> R: RenderParams;
@vertex
fn vs_main(@location(0) p: vec3<f32>) -> @builtin(position) vec4<f32> {
  return R.viewProj * vec4<f32>(p, 1.0);
}
@fragment
fn fs_main() -> @location(0) vec4<f32> {
  return vec4<f32>(0.78, 0.7, 1.0, 0.7);
}
`;

async function initAndRun() {
  const canvas = document.getElementById('gpu-canvas');
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.floor(canvas.clientWidth * dpr);
  canvas.height = Math.floor(canvas.clientHeight * dpr);
  window.addEventListener('resize', function () {
    canvas.width = Math.floor(canvas.clientWidth * dpr);
    canvas.height = Math.floor(canvas.clientHeight * dpr);
  });

  // v61: size the simulation box to match the canvas aspect, so the box
  // edges line up with the phone screen edges exactly. Keep BOX_HALF_Y
  // = 1.0 (height anchor) and derive width from aspect.
  // v62: depth (Z) was 0.06 (iPhone-thin), now defaults to 0.25.
  // v63: depth controllable via settings slider / ?d= URL param.
  const canvasAspect = canvas.width / canvas.height;   // < 1 in portrait
  BOX_HALF_X = canvasAspect * BOX_HALF_Y;
  BOX_HALF_Z = BOX_DEPTH_INITIAL;
  recomputeBoxDerived();
  applyPreset(state.preset);   // refresh pressureK + restDensity from new _natRho

  if (!navigator.gpu) throw new Error('navigator.gpu missing');
  setOverlayMsg('requesting adapter…');
  const adapter = await navigator.gpu.requestAdapter();
  if (!adapter) throw new Error('no adapter');
  setOverlayMsg('requesting device…');
  const device = await adapter.requestDevice();
  setOverlayMsg('allocating buffers…');
  device.addEventListener('uncapturederror', function (event) {
    const msg = event.error && event.error.message ? event.error.message : String(event.error);
    state.gpuError = (state.gpuError ? state.gpuError + ' | ' : '') + msg;
  });
  const ctx = canvas.getContext('webgpu');
  const format = navigator.gpu.getPreferredCanvasFormat();
  ctx.configure({ device: device, format: format, alphaMode: 'premultiplied' });

  // --- Buffers ---
  const posData = new Float32Array(N * 4);
  const velData = new Float32Array(N * 4);
  // Seed: random positions in the lower slab, small random velocities.
  // Reusable so the reset button can re-scramble.
  function seedParticles(seed) {
    let rng = (seed >>> 0) || 17;
    function rand() { rng = (Math.imul(rng, 1103515245) + 12345) & 0x7fffffff; return rng / 0x7fffffff; }
    for (let i = 0; i < N; i++) {
      // v60: seed in the lower half of the iPhone-aspect box, slightly
      // inside the walls. Fill ~60% of the height starting from the floor.
      posData[i * 4 + 0] = (rand() * 2 - 1) * (BOX_HALF_X * 0.85);
      posData[i * 4 + 1] = -BOX_HALF_Y * 0.85 + rand() * BOX_HALF_Y * 0.60;
      posData[i * 4 + 2] = (rand() * 2 - 1) * (BOX_HALF_Z * 0.85);
      posData[i * 4 + 3] = 0;
      velData[i * 4 + 0] = (rand() - 0.5) * 0.3;
      velData[i * 4 + 1] = (rand() - 0.5) * 0.3;
      velData[i * 4 + 2] = (rand() - 0.5) * 0.3;
      velData[i * 4 + 3] = 0;
    }
  }
  seedParticles(17);
  const posBuf = device.createBuffer({
    size: posData.byteLength,
    usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST,
  });
  device.queue.writeBuffer(posBuf, 0, posData);
  const velBuf = device.createBuffer({
    size: velData.byteLength,
    usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST,
  });
  device.queue.writeBuffer(velBuf, 0, velData);

  // Grid: 4 atomic<i32> per cell (mass + 3 momentum components) packed.
  const gridBuf = device.createBuffer({
    size: NUM_CELLS * 16,
    usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST,
  });
  // Per-cell velocity, vec4 f32, written by cs_grid, read by cs_g2p.
  const gridVelBuf = device.createBuffer({
    size: NUM_CELLS * 16,
    usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST,
  });
  setOverlayMsg('allocating particle buffers (' + N + ')…');
  // Per-particle affine velocity gradient C (3x3 matrix). WGSL mat3x3
  // storage layout is 48 bytes (3 columns of vec3 padded to vec4).
  const cMatBuf = device.createBuffer({
    size: N * 48,
    usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST,
  });
  // Initialise to zero so first frame has no velocity gradient.
  const zeroC = new Float32Array(N * 12);
  device.queue.writeBuffer(cMatBuf, 0, zeroC);

  // Wire up the reset button. Re-seeds particles with a new RNG, then
  // also zeros the C matrix so they start from rest.
  document.getElementById('reset-btn').addEventListener('click', function () {
    seedParticles(Math.floor(Math.random() * 1e6) + 1);
    device.queue.writeBuffer(posBuf, 0, posData);
    device.queue.writeBuffer(velBuf, 0, velData);
    device.queue.writeBuffer(cMatBuf, 0, zeroC);
    state.steps = 0;
  });

  // Sim uniform buffer.
  // v60: bumped 64 -> 80 to fit boxHalfX/Y/Z + gridHalf (was a single boxHalf).
  const SIM_PARAMS_SIZE = 80;
  const simParamsBuf = device.createBuffer({
    size: SIM_PARAMS_SIZE,
    usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST,
  });

  // Render uniform buffer (96 bytes).
  const RENDER_PARAMS_SIZE = 96;
  const renderParamsBuf = device.createBuffer({
    size: RENDER_PARAMS_SIZE,
    usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST,
  });
  // Composite uniform buffer. v53: bumped 48 → 64 for thicknessScale +
  // absorption. v56: bumped 64 → 80 for baseColor (per-preset hue).
  const COMPOSITE_PARAMS_SIZE = 80;
  const compositeParamsBuf = device.createBuffer({
    size: COMPOSITE_PARAMS_SIZE,
    usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST,
  });

  setOverlayMsg('compiling compute shaders…');
  // Compute pipelines (one bind-group layout shared by all four kernels).
  const computeModule = device.createShaderModule({ code: WGSL_COMPUTE });
  const computeLayout = device.createBindGroupLayout({
    entries: [
      { binding: 0, visibility: GPUShaderStage.COMPUTE, buffer: { type: 'storage' } },
      { binding: 1, visibility: GPUShaderStage.COMPUTE, buffer: { type: 'storage' } },
      { binding: 2, visibility: GPUShaderStage.COMPUTE, buffer: { type: 'storage' } },
      { binding: 3, visibility: GPUShaderStage.COMPUTE, buffer: { type: 'storage' } },
      { binding: 4, visibility: GPUShaderStage.COMPUTE, buffer: { type: 'uniform' } },
      { binding: 5, visibility: GPUShaderStage.COMPUTE, buffer: { type: 'storage' } },
    ],
  });
  const computePipelineLayout = device.createPipelineLayout({
    bindGroupLayouts: [computeLayout],
  });
  const clearPipeline = device.createComputePipeline({
    layout: computePipelineLayout,
    compute: { module: computeModule, entryPoint: 'cs_clearGrid' },
  });
  const p2gPipeline = device.createComputePipeline({
    layout: computePipelineLayout,
    compute: { module: computeModule, entryPoint: 'cs_p2g' },
  });
  const gridPipeline = device.createComputePipeline({
    layout: computePipelineLayout,
    compute: { module: computeModule, entryPoint: 'cs_grid' },
  });
  const g2pPipeline = device.createComputePipeline({
    layout: computePipelineLayout,
    compute: { module: computeModule, entryPoint: 'cs_g2p' },
  });
  const computeBindGroup = device.createBindGroup({
    layout: computeLayout,
    entries: [
      { binding: 0, resource: { buffer: posBuf } },
      { binding: 1, resource: { buffer: velBuf } },
      { binding: 2, resource: { buffer: gridBuf } },
      { binding: 3, resource: { buffer: gridVelBuf } },
      { binding: 4, resource: { buffer: simParamsBuf } },
      { binding: 5, resource: { buffer: cMatBuf } },
    ],
  });

  setOverlayMsg('compiling render shaders…');
  // Render pipelines (same as gpu.html).
  const depthModule = device.createShaderModule({ code: WGSL_DEPTH });
  const depthPipeline = device.createRenderPipeline({
    layout: 'auto',
    vertex: { module: depthModule, entryPoint: 'vs_main' },
    fragment: { module: depthModule, entryPoint: 'fs_main', targets: [] },
    primitive: { topology: 'triangle-list', cullMode: 'none' },
    depthStencil: { format: 'depth32float', depthWriteEnabled: true, depthCompare: 'less' },
  });
  const depthBindGroup = device.createBindGroup({
    layout: depthPipeline.getBindGroupLayout(0),
    entries: [
      { binding: 0, resource: { buffer: posBuf } },
      { binding: 1, resource: { buffer: renderParamsBuf } },
    ],
  });

  // v53: thickness pipeline. Same vertex shader shape as depth, fragment
  // writes a smooth falloff to a one-channel float target with additive
  // blending so multiple particles' imposters sum into a "thickness" map.
  const THICKNESS_FORMAT = 'r16float';
  const thicknessModule = device.createShaderModule({ code: WGSL_THICKNESS });
  const thicknessPipeline = device.createRenderPipeline({
    layout: 'auto',
    vertex: { module: thicknessModule, entryPoint: 'vs_main' },
    fragment: {
      module: thicknessModule, entryPoint: 'fs_main',
      targets: [{
        format: THICKNESS_FORMAT,
        blend: {
          color: { srcFactor: 'one', dstFactor: 'one', operation: 'add' },
          alpha: { srcFactor: 'one', dstFactor: 'one', operation: 'add' },
        },
      }],
    },
    primitive: { topology: 'triangle-list', cullMode: 'none' },
  });
  const thicknessBindGroup = device.createBindGroup({
    layout: thicknessPipeline.getBindGroupLayout(0),
    entries: [
      { binding: 0, resource: { buffer: posBuf } },
      { binding: 1, resource: { buffer: renderParamsBuf } },
    ],
  });

  const blurModule = device.createShaderModule({ code: WGSL_BLUR });
  const blurH = device.createRenderPipeline({
    layout: 'auto',
    vertex: { module: blurModule, entryPoint: 'vs_main' },
    fragment: { module: blurModule, entryPoint: 'fs_h', targets: [] },
    primitive: { topology: 'triangle-list', cullMode: 'none' },
    depthStencil: { format: 'depth32float', depthWriteEnabled: true, depthCompare: 'always' },
  });
  const blurV = device.createRenderPipeline({
    layout: 'auto',
    vertex: { module: blurModule, entryPoint: 'vs_main' },
    fragment: { module: blurModule, entryPoint: 'fs_v', targets: [] },
    primitive: { topology: 'triangle-list', cullMode: 'none' },
    depthStencil: { format: 'depth32float', depthWriteEnabled: true, depthCompare: 'always' },
  });

  const compositeModule = device.createShaderModule({ code: WGSL_COMPOSITE });
  const compositePipeline = device.createRenderPipeline({
    layout: 'auto',
    vertex: { module: compositeModule, entryPoint: 'vs_main' },
    fragment: { module: compositeModule, entryPoint: 'fs_main', targets: [{ format: format }] },
    primitive: { topology: 'triangle-list', cullMode: 'none' },
  });

  const linesModule = device.createShaderModule({ code: WGSL_LINES });
  const linesPipeline = device.createRenderPipeline({
    layout: 'auto',
    vertex: {
      module: linesModule, entryPoint: 'vs_main',
      buffers: [{ arrayStride: 12, attributes: [{ shaderLocation: 0, offset: 0, format: 'float32x3' }] }],
    },
    fragment: {
      module: linesModule, entryPoint: 'fs_main',
      targets: [{
        format: format,
        blend: {
          color: { srcFactor: 'src-alpha', dstFactor: 'one-minus-src-alpha', operation: 'add' },
          alpha: { srcFactor: 'one', dstFactor: 'zero', operation: 'add' },
        },
      }],
    },
    primitive: { topology: 'line-list' },
  });
  // v60: rectangular wireframe sized to the iPhone aspect box.
  const X = BOX_HALF_X, Y = BOX_HALF_Y, Z = BOX_HALF_Z;
  const cubeEdges = new Float32Array([
    -X,-Y,-Z,   X,-Y,-Z,     X,-Y,-Z,   X, Y,-Z,     X, Y,-Z,  -X, Y,-Z,    -X, Y,-Z,  -X,-Y,-Z,
    -X,-Y, Z,   X,-Y, Z,     X,-Y, Z,   X, Y, Z,     X, Y, Z,  -X, Y, Z,    -X, Y, Z,  -X,-Y, Z,
    -X,-Y,-Z,  -X,-Y, Z,     X,-Y,-Z,   X,-Y, Z,     X, Y,-Z,   X, Y, Z,    -X, Y,-Z,  -X, Y, Z
  ]);
  const cubeEdgeBuf = device.createBuffer({
    size: cubeEdges.byteLength,
    usage: GPUBufferUsage.VERTEX | GPUBufferUsage.COPY_DST,
  });
  device.queue.writeBuffer(cubeEdgeBuf, 0, cubeEdges);
  const linesBindGroup = device.createBindGroup({
    layout: linesPipeline.getBindGroupLayout(0),
    entries: [{ binding: 0, resource: { buffer: renderParamsBuf } }],
  });

  // Depth + thickness + background textures and ping-pong bind groups
  // for the SSF passes.
  let depthRaw = null, depthH = null, depthV = null, thicknessTex = null, backgroundTex = null;
  let compositeBindGroup = null, blurH1 = null, blurV1 = null, blurH2 = null, blurV2 = null;
  let lastW = 0, lastH = 0;
  function ensureDepthTex() {
    const w = canvas.width, h = canvas.height;
    if (w === lastW && h === lastH && depthRaw) return;
    if (depthRaw) depthRaw.destroy();
    if (depthH) depthH.destroy();
    if (depthV) depthV.destroy();
    if (thicknessTex) thicknessTex.destroy();
    if (backgroundTex) backgroundTex.destroy();
    const opts = {
      size: { width: w, height: h },
      format: 'depth32float',
      usage: GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.TEXTURE_BINDING,
    };
    depthRaw = device.createTexture(opts);
    depthH = device.createTexture(opts);
    depthV = device.createTexture(opts);
    thicknessTex = device.createTexture({
      size: { width: w, height: h },
      format: THICKNESS_FORMAT,
      usage: GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.TEXTURE_BINDING,
    });
    // v59: the background texture holds the box wireframe + clear colour.
    // Rendered each frame before the fluid composite, then sampled
    // (warped by surface normal) by the composite for refraction.
    backgroundTex = device.createTexture({
      size: { width: w, height: h },
      format: format,
      usage: GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.TEXTURE_BINDING,
    });
    blurH1 = device.createBindGroup({ layout: blurH.getBindGroupLayout(0), entries: [{ binding: 0, resource: depthRaw.createView() }] });
    blurV1 = device.createBindGroup({ layout: blurV.getBindGroupLayout(0), entries: [{ binding: 0, resource: depthH.createView() }] });
    blurH2 = device.createBindGroup({ layout: blurH.getBindGroupLayout(0), entries: [{ binding: 0, resource: depthV.createView() }] });
    blurV2 = device.createBindGroup({ layout: blurV.getBindGroupLayout(0), entries: [{ binding: 0, resource: depthH.createView() }] });
    compositeBindGroup = device.createBindGroup({
      layout: compositePipeline.getBindGroupLayout(0),
      entries: [
        { binding: 0, resource: depthV.createView() },
        { binding: 1, resource: { buffer: compositeParamsBuf } },
        { binding: 2, resource: thicknessTex.createView() },
        { binding: 3, resource: backgroundTex.createView() },
      ],
    });
    lastW = w; lastH = h;
  }

  // --- Camera ---
  function buildViewProj(aspect) {
    // v62: fit so the FRONT face of the box (z = +BOX_HALF_Z) fills the
    // viewport. Front-face is closer to camera, so it projects largest;
    // fitting from z=0 (v61) over-extended the front corners off-screen.
    const fovY = 50 * DEG;
    const near = 0.1, far = 100;
    const fitD = BOX_HALF_Y / Math.tan(fovY / 2) + BOX_HALF_Z;
    const eye = [0, 0, fitD];
    const f = 1 / Math.tan(fovY / 2);
    const proj = [
      f / aspect, 0, 0, 0,
      0, f, 0, 0,
      0, 0, far / (near - far), -1,
      0, 0, (near * far) / (near - far), 0
    ];
    const target = [0, 0, 0], up = [0, 1, 0];
    const zx = eye[0] - target[0], zy = eye[1] - target[1], zz = eye[2] - target[2];
    const zlen = Math.hypot(zx, zy, zz);
    const zn = [zx / zlen, zy / zlen, zz / zlen];
    const xx = up[1] * zn[2] - up[2] * zn[1];
    const xy = up[2] * zn[0] - up[0] * zn[2];
    const xz = up[0] * zn[1] - up[1] * zn[0];
    const xlen = Math.hypot(xx, xy, xz);
    const xn = [xx / xlen, xy / xlen, xz / xlen];
    const yn = [zn[1] * xn[2] - zn[2] * xn[1], zn[2] * xn[0] - zn[0] * xn[2], zn[0] * xn[1] - zn[1] * xn[0]];
    const view = [
      xn[0], yn[0], zn[0], 0,
      xn[1], yn[1], zn[1], 0,
      xn[2], yn[2], zn[2], 0,
      -(xn[0]*eye[0] + xn[1]*eye[1] + xn[2]*eye[2]),
      -(yn[0]*eye[0] + yn[1]*eye[1] + yn[2]*eye[2]),
      -(zn[0]*eye[0] + zn[1]*eye[1] + zn[2]*eye[2]),
      1
    ];
    const out = new Float32Array(16);
    for (let row = 0; row < 4; row++) {
      for (let col = 0; col < 4; col++) {
        let s = 0;
        for (let k = 0; k < 4; k++) s += proj[k * 4 + row] * view[col * 4 + k];
        out[col * 4 + row] = s;
      }
    }
    return { mvp: out, right: xn, up: yn };
  }

  // --- Main loop ---
  let lastT = performance.now() / 1000;
  let frames = 0, fpsAcc = 0;
  function frame() {
    requestAnimationFrame(frame);
    const now = performance.now() / 1000;
    let dt = now - lastT;
    lastT = now;
    if (dt > 1 / 20) dt = 1 / 20;
    if (dt < 1 / 240) dt = 1 / 240;

    state.gravity.x += (state.target.x - state.gravity.x) * 0.15;
    state.gravity.y += (state.target.y - state.gravity.y) * 0.15;
    state.gravity.z += (state.target.z - state.gravity.z) * 0.15;

    // MPM substep. Use a small fixed dt for stability — the grid CFL
    // condition wants cell-size / max-velocity, but with damping a fixed
    // 1/240 is comfortable.
    const SUB_DT = 1 / 240;
    const subSteps = Math.max(1, Math.min(6, Math.ceil(dt / SUB_DT)));
    const stepDt = dt / subSteps;

    // Sim params layout (16-aligned).
    const simBuf = new Float32Array(SIM_PARAMS_SIZE / 4);
    simBuf[0] = state.gravity.x;
    simBuf[1] = state.gravity.y;
    simBuf[2] = state.gravity.z;
    simBuf[3] = stepDt;          // packs into vec3 slack
    // v60: per-axis box half-extents + cubic-grid half-extent.
    simBuf[4] = BOX_HALF_X;
    simBuf[5] = BOX_HALF_Y;
    simBuf[6] = BOX_HALF_Z;
    simBuf[7] = GRID_HALF;
    simBuf[8] = CELL_SIZE;
    simBuf[9] = 1.0 / CELL_SIZE;
    simBuf[10] = FIXED_POINT;
    // All tunables sourced from SIM_TUNE so the debug strip can show
    // exactly which values the GPU is using each frame.
    simBuf[11] = SIM_TUNE.particleMass;
    simBuf[12] = SIM_TUNE.velDamping;
    simBuf[13] = SIM_TUNE.restitution;
    simBuf[14] = SIM_TUNE.pressureK;
    simBuf[15] = SIM_TUNE.restDensity;
    simBuf[16] = SIM_TUNE.maxAccel;
    simBuf[17] = SIM_TUNE.wallFriction;
    simBuf[18] = SIM_TUNE.viscosity;
    simBuf[19] = 0;
    device.queue.writeBuffer(simParamsBuf, 0, simBuf);

    const cellGroups = Math.ceil(NUM_CELLS / 64);
    const particleGroups = Math.ceil(N / 64);
    for (let s = 0; s < subSteps; s++) {
      const enc = device.createCommandEncoder();
      const pass = enc.beginComputePass();
      pass.setBindGroup(0, computeBindGroup);
      pass.setPipeline(clearPipeline);
      pass.dispatchWorkgroups(cellGroups);
      pass.setPipeline(p2gPipeline);
      pass.dispatchWorkgroups(particleGroups);
      pass.setPipeline(gridPipeline);
      pass.dispatchWorkgroups(cellGroups);
      pass.setPipeline(g2pPipeline);
      pass.dispatchWorkgroups(particleGroups);
      pass.end();
      device.queue.submit([enc.finish()]);
      state.steps++;
    }

    // Render.
    const aspect = canvas.width / canvas.height;
    const cam = buildViewProj(aspect);
    const renderBuf = new Float32Array(24);
    renderBuf.set(cam.mvp, 0);
    renderBuf[16] = cam.right[0]; renderBuf[17] = cam.right[1]; renderBuf[18] = cam.right[2];
    renderBuf[19] = PARTICLE_RADIUS;
    renderBuf[20] = cam.up[0]; renderBuf[21] = cam.up[1]; renderBuf[22] = cam.up[2];
    // v55: per-particle thickness contribution. v53/v54 left this at 0,
    // which made the thickness pass write all-zeros → Beer's law gave no
    // absorption → fluid rendered nearly white + bright sky reflection =
    // silver. With ~10 particles overlapping a deep pixel and this value
    // at 0.10, the additive thickness sums to ~1.0 at the centre, which
    // (combined with thicknessScale 0.18 in the composite) drops red
    // ~60% via Beer's law — a clear blue tint where the fluid is thick.
    renderBuf[23] = 0.10;
    device.queue.writeBuffer(renderParamsBuf, 0, renderBuf);

    ensureDepthTex();
    const fovY = 50 * DEG;
    const f = 1 / Math.tan(fovY / 2);
    const compBuf = new Float32Array(COMPOSITE_PARAMS_SIZE / 4);
    compBuf[0] = 0.1; compBuf[1] = 100;
    compBuf[2] = f / aspect; compBuf[3] = f;
    compBuf[4] = canvas.width; compBuf[5] = canvas.height;
    // v53: thicknessScale maps the additive-blended raw thickness texture
    // value into Beer's-law absorption units. Tuned so a "full" column of
    // particles (a few overlapping imposters deep) drops the red channel
    // to near zero while leaving blue mostly intact.
    // v59: compBuf[7] is now refractStrength (per-preset, in pixels).
    compBuf[6] = 0.18; compBuf[7] = SIM_TUNE.refractStrength;
    const Lw = [0.35, 0.80, 0.50];
    const Lv = [
      cam.right[0]*Lw[0] + cam.right[1]*Lw[1] + cam.right[2]*Lw[2],
      cam.up[0]*Lw[0]    + cam.up[1]*Lw[1]    + cam.up[2]*Lw[2],
      -(Lw[0] * (cam.right[1]*cam.up[2] - cam.right[2]*cam.up[1]) +
        Lw[1] * (cam.right[2]*cam.up[0] - cam.right[0]*cam.up[2]) +
        Lw[2] * (cam.right[0]*cam.up[1] - cam.right[1]*cam.up[0]))
    ];
    const Llen = Math.hypot(Lv[0], Lv[1], Lv[2]) || 1;
    compBuf[8] = Lv[0] / Llen; compBuf[9] = Lv[1] / Llen; compBuf[10] = Lv[2] / Llen;
    compBuf[11] = 0;
    // v56: Beer's law extinction + base colour are per-preset (sourced
    // from SIM_TUNE). Tapping a preset hot-swaps both physics and look.
    compBuf[12] = SIM_TUNE.absorptionR;
    compBuf[13] = SIM_TUNE.absorptionG;
    compBuf[14] = SIM_TUNE.absorptionB;
    compBuf[15] = 0;
    compBuf[16] = SIM_TUNE.baseColorR;
    compBuf[17] = SIM_TUNE.baseColorG;
    compBuf[18] = SIM_TUNE.baseColorB;
    compBuf[19] = 0;
    device.queue.writeBuffer(compositeParamsBuf, 0, compBuf);

    const enc2 = device.createCommandEncoder();
    // v59: background pass — clear + box wireframe lines into backgroundTex.
    // The composite shader samples this with a normal-warped UV to produce
    // refraction; it also blits straight through where there's no fluid,
    // so this is the only place the wireframe is drawn.
    {
      const p = enc2.beginRenderPass({
        colorAttachments: [{
          view: backgroundTex.createView(),
          clearValue: { r: 0.02, g: 0.025, b: 0.06, a: 1 },
          loadOp: 'clear', storeOp: 'store',
        }],
      });
      p.setPipeline(linesPipeline); p.setBindGroup(0, linesBindGroup);
      p.setVertexBuffer(0, cubeEdgeBuf); p.draw(24, 1);
      p.end();
    }
    // Thickness (additive). Each particle adds a soft falloff disc into
    // the thickness target; total per pixel is the view-ray fluid mass
    // sampled by the Beer's-law branch of the composite shader.
    {
      const p = enc2.beginRenderPass({
        colorAttachments: [{
          view: thicknessTex.createView(),
          clearValue: { r: 0, g: 0, b: 0, a: 0 },
          loadOp: 'clear', storeOp: 'store',
        }],
      });
      p.setPipeline(thicknessPipeline); p.setBindGroup(0, thicknessBindGroup);
      p.draw(6, N); p.end();
    }
    // Depth.
    {
      const p = enc2.beginRenderPass({
        colorAttachments: [],
        depthStencilAttachment: { view: depthRaw.createView(), depthClearValue: 1.0, depthLoadOp: 'clear', depthStoreOp: 'store' },
      });
      p.setPipeline(depthPipeline); p.setBindGroup(0, depthBindGroup);
      p.draw(6, N); p.end();
    }
    const blurSeq = [
      { pipe: blurH, bind: blurH1, target: depthH },
      { pipe: blurV, bind: blurV1, target: depthV },
      { pipe: blurH, bind: blurH2, target: depthH },
      { pipe: blurV, bind: blurV2, target: depthV },
    ];
    for (const step of blurSeq) {
      const p = enc2.beginRenderPass({
        colorAttachments: [],
        depthStencilAttachment: { view: step.target.createView(), depthClearValue: 1.0, depthLoadOp: 'clear', depthStoreOp: 'store' },
      });
      p.setPipeline(step.pipe); p.setBindGroup(0, step.bind);
      p.draw(3, 1); p.end();
    }
    const view = ctx.getCurrentTexture().createView();
    {
      // v59: composite both blits the background through (no-fluid pixels)
      // and refracts it for fluid pixels, so the wireframe is no longer
      // re-drawn on top of the canvas — it's already inside backgroundTex.
      const p = enc2.beginRenderPass({
        colorAttachments: [{ view: view, clearValue: { r: 0, g: 0, b: 0, a: 1 }, loadOp: 'clear', storeOp: 'store' }],
      });
      p.setPipeline(compositePipeline); p.setBindGroup(0, compositeBindGroup);
      p.draw(3, 1);
      p.end();
    }
    device.queue.submit([enc2.finish()]);

    frames++; fpsAcc += dt;
    if (fpsAcc > 0.5) { state.fps = frames / fpsAcc; frames = 0; fpsAcc = 0; }
    updateDebug();
  }
  frame();
}

function fmt(v) {
  const s = (v >= 0 ? ' ' : '') + v.toFixed(2);
  return s.padStart(6, ' ');
}
function updateDebug() {
  // Pressure-wave CFL: c = sqrt(K/rho0), required dt < cellSize/c.
  const soundC = Math.sqrt(SIM_TUNE.pressureK / SIM_TUNE.restDensity);
  const cflDt = CELL_SIZE / soundC;
  const debugEl = debugTextEl.parentElement;
  const collapsed = debugEl && debugEl.classList.contains('collapsed');
  if (collapsed) {
    // One-line summary. Tap to expand.
    debugTextEl.textContent =
      (state.presetLabel || '—') +
      '  ·  fps ' + state.fps.toFixed(0) +
      '  ·  ' + N + 'p' +
      (state.gpuError ? '  ·  GPU ERR' : '');
    return;
  }
  debugTextEl.textContent =
    'preset: ' + (state.presetLabel || state.preset) + '   (tap to collapse)\n' +
    'fps: ' + state.fps.toFixed(1) + '   particles: ' + N + '   grid: ' + GRID_SIZE + '³   steps: ' + state.steps + '\n' +
    'gyro: ' + state.gyroPermission + '   β=' + fmt(state.beta) + ' γ=' + fmt(state.gamma) + '   evt: ' + state.events + '\n' +
    'gravity x:' + fmt(state.gravity.x) + ' y:' + fmt(state.gravity.y) + ' z:' + fmt(state.gravity.z) + '\n' +
    'EOS=' + SIM_TUNE.eos +
      '  K=' + SIM_TUNE.pressureK +
      '  ρ₀=' + SIM_TUNE.restDensity +
      '  m=' + SIM_TUNE.particleMass + '\n' +
    'damp=' + SIM_TUNE.velDamping.toFixed(4) +
      '  rest=' + SIM_TUNE.restitution.toFixed(2) +
      '  aMax=' + SIM_TUNE.maxAccel +
      '  cell=' + CELL_SIZE.toFixed(4) + '\n' +
    'wallFric=' + SIM_TUNE.wallFriction.toFixed(2) +
      '  visc=' + SIM_TUNE.viscosity.toFixed(3) + '\n' +
    'CFL: c=' + soundC.toFixed(2) + '  dtCFL=' + cflDt.toFixed(4) +
      '  ourDt≤1/240=' + (1/240).toFixed(4) +
      '  margin=' + (cflDt / (1/240)).toFixed(1) + 'x' +
    (state.gpuError ? '\nGPU ERR: ' + state.gpuError : '');
}
updateDebug();

copyBtn.addEventListener('click', function () {
  const soundC = Math.sqrt(SIM_TUNE.pressureK / SIM_TUNE.restDensity);
  const cflDt = CELL_SIZE / soundC;
  const report = [
    '=== Water Box MPM debug ===',
    'version: ' + APP_VERSION,
    'preset:  ' + (state.presetLabel || state.preset),
    'fps: ' + state.fps.toFixed(1),
    'particles: ' + N,
    'grid: ' + GRID_SIZE + '^3 = ' + NUM_CELLS + ' cells',
    'cellSize: ' + CELL_SIZE.toFixed(5),
    'steps: ' + state.steps,
    '',
    '--- gyro ---',
    'permission: ' + state.gyroPermission,
    'events: ' + state.events,
    'beta:  ' + state.beta.toFixed(3),
    'gamma: ' + state.gamma.toFixed(3),
    'gravity x: ' + state.gravity.x.toFixed(3),
    'gravity y: ' + state.gravity.y.toFixed(3),
    'gravity z: ' + state.gravity.z.toFixed(3),
    '',
    '--- tunable constants ---',
    'EOS:           ' + SIM_TUNE.eos,
    'pressureK:     ' + SIM_TUNE.pressureK,
    'restDensity:   ' + SIM_TUNE.restDensity,
    'particleMass:  ' + SIM_TUNE.particleMass,
    'velDamping:    ' + SIM_TUNE.velDamping,
    'restitution:   ' + SIM_TUNE.restitution,
    'maxAccel:      ' + SIM_TUNE.maxAccel,
    'wallFriction:  ' + SIM_TUNE.wallFriction,
    'viscosity:     ' + SIM_TUNE.viscosity,
    '',
    '--- derived / CFL ---',
    'sound speed c = sqrt(K/ρ₀) = ' + soundC.toFixed(3),
    'CFL dt < cellSize/c       = ' + cflDt.toFixed(5),
    'substep dt cap (1/240)    = ' + (1/240).toFixed(5),
    'CFL margin                = ' + (cflDt / (1/240)).toFixed(2) + 'x',
    '',
    'init error: ' + (state.initError || 'none'),
    'gpu error:  ' + (state.gpuError || 'none'),
    'userAgent: ' + navigator.userAgent,
  ].join('\n');
  function ok() { copyBtn.textContent = 'Copied ✓'; setTimeout(function () { copyBtn.textContent = 'Copy debug info'; }, 1500); }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(report).then(ok, function () {
      const ta = document.createElement('textarea');
      ta.value = report; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); ok(); } catch (_) {}
      document.body.removeChild(ta);
    });
  }
});
</script>
</body>
