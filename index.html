<style>
  html, body {

    background: #050913;

  #permission-overlay {

  }
  #permission-overlay h1 {
    margin: 0; font-size: 26px; font-weight: 600; letter-spacing: 0.5px;
  }
  #permission-overlay p {
    margin: 0 24px; font-size: 15px; opacity: 0.8; max-width: 320px; line-height: 1.4;
  }
  #permission-btn {

    box-shadow: 0 8px 24px rgba(74,163,255,0.35);

  }

  #hint { font-size: 12px; opacity: 0.55; margin-top: 8px; }
  #overlay-tests {
    margin-top: 12px;
    padding: 6px 14px;

  }
  #overlay-tests.fail { background: rgba(220,80,80,0.30); color: #ffc0c0; }
  #overlay-tests.pending { background: rgba(160,160,180,0.18); color: #c8c8d4; }
  #overlay-tests .fails {

  #fps {

  }
  #version {

  #debug {

  #copy-btn {

  #reset-btn {

    display: block; margin-top: 6px; width: 100%; min-height: 36px;

    background: rgba(220,140,80,0.30); color: #fff;

  }
  #reset-btn:active { transform: scale(0.98); }
</style>
<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>

</head>
<body>
<div id="permission-overlay">
  <h1>Water Box</h1>
  <p>Tilt your phone to slosh the water inside the glass. On iPhone, tap below to allow motion access.</p>
  <button id="permission-btn">Tap to begin</button>
  <div id="overlay-tests" class="pending">Unit tests: running…</div>
  <div id="hint">Desktop: drag the canvas to tilt</div>
  <div id="overlay-version"></div>
</div>
<div id="fps"></div>
<div id="version"></div>
<div id="debug"><div id="debug-text">gyro: waiting…</div><button id="copy-btn">Copy debug info</button><button id="reset-btn">Reset simulation</button></div>
<script>
(function () {
  'use strict';

  // ---------- Version ----------
  // Bump this on every commit so you can verify the page rebuilt.
  const APP_VERSION = 'v23 (2026-05-10 — 3D flow + wave injection)';
  document.getElementById('version').textContent = APP_VERSION;
  document.getElementById('overlay-version').textContent = APP_VERSION;

  // Surface unit-test results on the permission overlay so we know the
  // shipped build is sound before tapping in.
  (function showTestResults() {
    const el = document.getElementById('overlay-tests');
    const results = window.__TEST_RESULTS__ || [];
    if (!results.length) {
      el.textContent = 'Unit tests: not loaded';
      el.className = 'fail';
      return;
    }
    let pass = 0, fail = 0;
    const failNames = [];
    for (const r of results) {
      if (r.pass) pass++;
      else { fail++; failNames.push(r.name); }
    }
    if (fail === 0) {
      el.textContent = 'Unit tests: ' + pass + ' passed ✓';
      el.className = '';
    } else {
      el.innerHTML =
        '<div>Unit tests: ' + pass + ' passed, ' + fail + ' failed ✗</div>' +
        '<div class="fails">' + failNames.map(function (n) { return '• ' + n; }).join('<br>') + '</div>';
      el.className = 'fail';
    }
  })();

  // ---------- Constants ----------
  const GRID_N = 64;
  const BOX_SIZE = 2.0;
  const WATER_REST_Y = -0.35;
  const MAX_PARTICLES = 300;
  // CFL stability for 2D wave equation: WAVE_C * dt / dx <= 1/sqrt(2) ~ 0.707.
  // With dx = 2/63, dt = 1/120 (substep cap below), critical is c <= 1.78.
  // We use c = 0.6 for very generous margin so any browser timing weirdness
  // can't push us into the unstable regime.
  const WAVE_C = 0.6;
  // Velocity drag (1/s). Damps motion without biasing the equilibrium.
  // Set above half-critical so transient overshoot stays modest under any
  // gyro orientation (verified by the gyro-sweep unit test).
  const VEL_DAMPING = 3.5;
  // Tiny amplitude floor for numerical hygiene only.
  const AMP_DAMPING = 0.9999;
  // Spring stiffness pulling surface toward the gravity-tilted equilibrium plane.
  // Higher = surface follows the phone more rigidly. Units roughly 1/s^2.
  const TILT_STIFFNESS = 10.0;
  // Below this vertical-gravity magnitude (phone near-vertical) the equilibrium
  // tilt blows up; clamp to keep the sim bounded.
  const MIN_VERTICAL_G = 3.0;
  // Hard cap on how steep the equilibrium plane can be (in scene units across
  // half the box). Prevents extreme tilts from driving heights past the box.
  const MAX_EQ_AMP = 0.30;
  const SPAWN_THRESHOLD = 1.8;
  const SPAWN_PROBABILITY = 0.15;
  const PARTICLE_LIFE = 1.5;
  const GRAVITY_MAG = 9.8;
  const PIXEL_RATIO_CAP = 2;
  const DT_CLAMP_MIN = 1 / 240;
  const DT_CLAMP_MAX = 1 / 30;
  // Substep cap: each physics step uses at most this dt. Smaller value gives
  // the wave equation more CFL margin; we use 1/120 so even a 30fps frame
  // produces only sub-1/60-safe substeps.
  const FIXED_DT = 1 / 120;

  const DEG2RAD = Math.PI / 180;

  // ---------- Three.js setup ----------
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x050913);
  scene.fog = new THREE.Fog(0x050913, 6, 14);

  const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
  camera.position.set(0, 1.6, 4.0);
  camera.lookAt(0, 0, 0);

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: 'high-performance' });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, PIXEL_RATIO_CAP));
  renderer.setSize(window.innerWidth, window.innerHeight);
  if ('outputColorSpace' in renderer) renderer.outputColorSpace = THREE.SRGBColorSpace;
  document.body.appendChild(renderer.domElement);

  // ---------- Lights ----------
  scene.add(new THREE.AmbientLight(0x8090b0, 0.55));
  const keyLight = new THREE.DirectionalLight(0xffffff, 1.0);
  keyLight.position.set(3, 5, 2);
  scene.add(keyLight);
  const fillLight = new THREE.HemisphereLight(0x88aaff, 0x202030, 0.45);
  scene.add(fillLight);

  // ---------- Glass box ----------
  const halfBox = BOX_SIZE / 2;
  const boxGeom = new THREE.BoxGeometry(BOX_SIZE, BOX_SIZE, BOX_SIZE);
  const boxMat = new THREE.MeshPhongMaterial({
    color: 0x88ccff,
    transparent: true,
    opacity: 0.05,
    shininess: 120,
    specular: 0xffffff,
    side: THREE.BackSide,
    depthWrite: false
  });
  const boxMesh = new THREE.Mesh(boxGeom, boxMat);
  boxMesh.renderOrder = 0;
  scene.add(boxMesh);

  const edgeGeom = new THREE.EdgesGeometry(boxGeom);
  const edgeMat = new THREE.LineBasicMaterial({ color: 0xa8d8ff, transparent: true, opacity: 0.85 });
  const edgeLines = new THREE.LineSegments(edgeGeom, edgeMat);
  edgeLines.renderOrder = 3;
  scene.add(edgeLines);

  // Floor inside box (helps depth perception)
  const floorGeom = new THREE.PlaneGeometry(BOX_SIZE, BOX_SIZE);
  const floorMat = new THREE.MeshPhongMaterial({ color: 0x102030, side: THREE.DoubleSide, shininess: 30 });
  const floorMesh = new THREE.Mesh(floorGeom, floorMat);
  floorMesh.rotation.x = -Math.PI / 2;
  floorMesh.position.y = -halfBox + 0.001;
  scene.add(floorMesh);

  // ---------- Height-field water surface ----------
  // Water plane size: smaller than the box so it can rotate to follow gravity
  // and remain inside the cube at most orientations. At extreme diagonals the
  // corners may clip slightly through the glass walls.
  const WATER_PLANE_SIZE = 1.5;
  const WATER_OFFSET = 0.4;   // distance along gravity from box center to plane
  const waterGeom = new THREE.PlaneGeometry(WATER_PLANE_SIZE, WATER_PLANE_SIZE, GRID_N - 1, GRID_N - 1);
  const waterMat = new THREE.MeshPhongMaterial({
    color: 0x3aa3e8,
    emissive: 0x0a2540,
    transparent: true,
    opacity: 0.92,
    shininess: 140,
    specular: 0xffffff,
    side: THREE.DoubleSide,
    flatShading: false
  });
  const waterMesh = new THREE.Mesh(waterGeom, waterMat);
  // Initial orientation: horizontal (will be overwritten every frame from gravity).
  waterMesh.quaternion.setFromUnitVectors(
    new THREE.Vector3(0, 0, 1), new THREE.Vector3(0, 1, 0)
  );
  waterMesh.position.set(0, -WATER_OFFSET, 0);
  waterMesh.renderOrder = 2;
  scene.add(waterMesh);

  // Scratch vectors reused each frame for the water-plane orientation update.
  const _gravUnit = new THREE.Vector3();
  const _planeNormal = new THREE.Vector3();
  const _planeDefault = new THREE.Vector3(0, 0, 1); // PlaneGeometry default normal
  function updateWaterMeshOrientation() {
    const len = gravity.length();
    if (len < 1e-6) return;
    _gravUnit.copy(gravity).divideScalar(len);
    // Position: along the gravity direction so the surface sits at the bottom
    // of the box relative to gravity. With gravity down: y = -OFFSET (lower
    // part of box). With gravity right: x = +OFFSET (right side).
    waterMesh.position.copy(_gravUnit).multiplyScalar(WATER_OFFSET);
    // Orientation: plane normal = -gravity (pointing "up" relative to gravity).
    _planeNormal.copy(_gravUnit).negate();
    waterMesh.quaternion.setFromUnitVectors(_planeDefault, _planeNormal);
  }

  // Track gravity to inject wave packets when the phone rotates, so the user
  // sees the surface ripple as they tilt.
  const _lastGravity = new THREE.Vector3(0, -GRAVITY_MAG, 0);
  function injectRotationWaves() {
    const dx = gravity.x - _lastGravity.x;
    const dy = gravity.y - _lastGravity.y;
    const dz = gravity.z - _lastGravity.z;
    const change = Math.sqrt(dx * dx + dy * dy + dz * dz);
    if (change > 0.20) {
      const amp = Math.min(0.06, change * 0.04);
      const ci = 12 + Math.floor(Math.random() * (GRID_N - 24));
      const cj = 12 + Math.floor(Math.random() * (GRID_N - 24));
      field.pokeGaussian(ci, cj, (Math.random() < 0.5 ? amp : -amp), 3.0);
    }
    _lastGravity.copy(gravity);
  }

  // Gentle ambient ripple so the surface always shows tiny life even when
  // the phone is still. Tiny amplitude — won't excite instability.
  function injectAmbientRipple() {
    if (Math.random() < 0.04) {
      const ci = 4 + Math.floor(Math.random() * (GRID_N - 8));
      const cj = 4 + Math.floor(Math.random() * (GRID_N - 8));
      field.pokeGaussian(ci, cj, (Math.random() - 0.5) * 0.008, 2.0);
    }
  }

  // ---------- HeightField simulation ----------
  // Class lives in sim.js so it can be unit-tested independently (see test.html).
  const field = new HeightField(GRID_N, {
    boxSize: WATER_PLANE_SIZE,    // match the actual water plane size
    waveC: WAVE_C,
    velDamping: VEL_DAMPING,
    ampDamping: AMP_DAMPING,
    tiltStiffness: TILT_STIFFNESS,
    minVerticalG: MIN_VERTICAL_G,
    maxEqAmp: MAX_EQ_AMP
  });

  // Seed with smooth Gaussian pokes for visible motion without spikes.
  field.pokeGaussian(GRID_N >> 1, GRID_N >> 1, 0.12, 3.5);
  field.pokeGaussian((GRID_N >> 1) - 10, (GRID_N >> 1) + 8, 0.07, 3.0);
  field.pokeGaussian((GRID_N >> 1) + 12, (GRID_N >> 1) - 6, 0.07, 3.0);
  field.startAtRest();

  // Helper: convert grid (i,j) -> world (x, z) inside the box.
  function gridToWorld(i, j) {
    const halfN = (GRID_N - 1) / 2;
    const x = (i - halfN) * field.dx;
    const z = (j - halfN) * field.dx;
    return { x: x, z: z };
  }
  function worldToGrid(x, z) {
    const halfN = (GRID_N - 1) / 2;
    const i = Math.round(x / field.dx + halfN);
    const j = Math.round(z / field.dx + halfN);
    return { i: i, j: j };
  }

  // Apply heights to plane geometry. Plane is rotated; pre-rotation Z becomes world Y.
  const waterPos = waterGeom.attributes.position;
  function syncWaterMesh() {
    const arr = waterPos.array;
    const h = field.h;
    // PlaneGeometry vertex layout matches our (i,j) grid: vertex k = j*N + i.
    for (let k = 0; k < h.length; k++) {
      arr[k * 3 + 2] = h[k];
    }
    waterPos.needsUpdate = true;
    waterGeom.computeVertexNormals();
  }

  // ---------- Particle system (splashes) ----------
  function makeSpriteTexture() {
    const size = 64;
    const c = document.createElement('canvas');
    c.width = c.height = size;
    const ctx = c.getContext('2d');
    const grd = ctx.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
    grd.addColorStop(0.0, 'rgba(220,240,255,1)');
    grd.addColorStop(0.4, 'rgba(120,180,230,0.85)');
    grd.addColorStop(1.0, 'rgba(60,120,200,0)');
    ctx.fillStyle = grd;
    ctx.fillRect(0, 0, size, size);
    const tex = new THREE.CanvasTexture(c);
    if ('colorSpace' in tex) tex.colorSpace = THREE.SRGBColorSpace;
    tex.needsUpdate = true;
    return tex;
  }

  const particleGeom = new THREE.BufferGeometry();
  const particlePositions = new Float32Array(MAX_PARTICLES * 3);
  for (let p = 0; p < MAX_PARTICLES; p++) {
    particlePositions[p * 3 + 0] = 0;
    particlePositions[p * 3 + 1] = -9999;
    particlePositions[p * 3 + 2] = 0;
  }
  particleGeom.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
  const particleMat = new THREE.PointsMaterial({
    size: 0.07,
    map: makeSpriteTexture(),
    transparent: true,
    depthWrite: false,
    sizeAttenuation: true,
    blending: THREE.NormalBlending,
    color: 0xffffff
  });
  const particlePoints = new THREE.Points(particleGeom, particleMat);
  scene.add(particlePoints);

  const particles = new Array(MAX_PARTICLES);
  for (let p = 0; p < MAX_PARTICLES; p++) {
    particles[p] = {
      x: 0, y: -9999, z: 0,
      vx: 0, vy: 0, vz: 0,
      life: 0,
      alive: false
    };
  }

  function findFreeParticle() {
    for (let p = 0; p < MAX_PARTICLES; p++) {
      if (!particles[p].alive) return p;
    }
    return -1;
  }

  // Scratch vectors for splash particle math, reused per call.
  const _splashLocal = new THREE.Vector3();
  const _splashTmp = new THREE.Vector3();
  function spawnSplashParticles(gravity) {
    const h = field.h;
    const vel = field.vel;
    const halfN = (GRID_N - 1) / 2;
    const dx = field.dx;
    for (let j = 2; j < GRID_N - 2; j += 2) {
      for (let i = 2; i < GRID_N - 2; i += 2) {
        const k = j * GRID_N + i;
        if (vel[k] > SPAWN_THRESHOLD && Math.random() < SPAWN_PROBABILITY) {
          const slot = findFreeParticle();
          if (slot < 0) return;
          const p = particles[slot];
          // Local (plane-frame) position: PlaneGeometry vertex k has local
          // (x = (i-halfN)*dx, y = -(j-halfN)*dx, z = h[k]). Transform to
          // world using the water mesh's current orientation.
          _splashLocal.set(
            (i - halfN) * dx,
            -(j - halfN) * dx,
            h[k] + 0.02
          );
          waterMesh.localToWorld(_splashLocal);
          p.x = _splashLocal.x;
          p.y = _splashLocal.y;
          p.z = _splashLocal.z;
          const gmag = Math.sqrt(gravity.x * gravity.x + gravity.y * gravity.y + gravity.z * gravity.z) || 1;
          const ux = -gravity.x / gmag;
          const uy = -gravity.y / gmag;
          const uz = -gravity.z / gmag;
          const speed = Math.min(vel[k], 4.0) * 0.55;
          p.vx = ux * speed + (Math.random() - 0.5) * 0.4;
          p.vy = uy * speed + (Math.random() - 0.5) * 0.2;
          p.vz = uz * speed + (Math.random() - 0.5) * 0.4;
          p.life = PARTICLE_LIFE;
          p.alive = true;
        }
      }
    }
  }

  function stepParticles(dt, gravity) {
    const arr = particlePositions;
    for (let pi = 0; pi < MAX_PARTICLES; pi++) {
      const p = particles[pi];
      if (!p.alive) {
        arr[pi * 3 + 1] = -9999;
        continue;
      }
      p.vx += gravity.x * dt;
      p.vy += gravity.y * dt;
      p.vz += gravity.z * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.z += p.vz * dt;
      p.life -= dt;

      // Box wall collisions (all 6 faces).
      if (p.x < -halfBox) { p.x = -halfBox; p.vx = -p.vx * 0.4; }
      else if (p.x > halfBox) { p.x = halfBox; p.vx = -p.vx * 0.4; }
      if (p.y < -halfBox) { p.y = -halfBox; p.vy = -p.vy * 0.4; }
      else if (p.y > halfBox) { p.y = halfBox; p.vy = -p.vy * 0.4; }
      if (p.z < -halfBox) { p.z = -halfBox; p.vz = -p.vz * 0.4; }
      else if (p.z > halfBox) { p.z = halfBox; p.vz = -p.vz * 0.4; }

      // Water surface detection in the rotated plane: signed distance from
      // the plane along its normal. Positive = above surface (in air),
      // negative = particle has re-entered the water.
      _splashTmp.set(
        p.x - waterMesh.position.x,
        p.y - waterMesh.position.y,
        p.z - waterMesh.position.z
      );
      const distFromSurface = _splashTmp.dot(_planeNormal);

      let dead = false;
      if (distFromSurface < -0.03) dead = true;   // back into water
      if (p.life <= 0) dead = true;

      if (dead) {
        p.alive = false;
        arr[pi * 3 + 0] = 0;
        arr[pi * 3 + 1] = -9999;
        arr[pi * 3 + 2] = 0;
      } else {
        arr[pi * 3 + 0] = p.x;
        arr[pi * 3 + 1] = p.y;
        arr[pi * 3 + 2] = p.z;
      }
    }
    particleGeom.attributes.position.needsUpdate = true;
  }

  // ---------- Gravity (gyroscope + fallback) ----------
  const gravity = new THREE.Vector3(0, -GRAVITY_MAG, 0);
  const gravityTarget = new THREE.Vector3(0, -GRAVITY_MAG, 0);

  // Diagnostics: surfaced in the on-screen debug panel.
  const gyro = {
    permission: 'unknown',  // 'unknown' | 'granted' | 'denied' | 'no-api' | 'error'
    eventCount: 0,
    lastBeta: 0,
    lastGamma: 0,
    lastEventTime: 0
  };

  function updateGravityFromOrientation(beta, gamma) {
    // Use the shared, unit-tested mapping from sim.js.
    const orient = (screen.orientation && typeof screen.orientation.angle === 'number')
      ? screen.orientation.angle
      : (typeof window.orientation === 'number' ? window.orientation : 0);
    const g = mapOrientationToGravity(beta, gamma, orient, GRAVITY_MAG);
    gravityTarget.set(g.x, g.y, g.z);
  }

  function onDeviceOrientation(e) {
    gyro.eventCount++;
    gyro.lastBeta = e.beta || 0;
    gyro.lastGamma = e.gamma || 0;
    gyro.lastEventTime = performance.now();
    updateGravityFromOrientation(e.beta, e.gamma);
  }

  // ---------- iOS permission flow ----------
  const overlay = document.getElementById('permission-overlay');
  const permissionBtn = document.getElementById('permission-btn');

  function attachOrientationListener() {
    window.addEventListener('deviceorientation', onDeviceOrientation, true);
  }

  function hideOverlay() {
    overlay.style.display = 'none';
  }

  permissionBtn.addEventListener('click', function () {
    if (typeof DeviceOrientationEvent !== 'undefined' &&
        typeof DeviceOrientationEvent.requestPermission === 'function') {
      DeviceOrientationEvent.requestPermission().then(function (state) {
        gyro.permission = state;
        if (state === 'granted') attachOrientationListener();
        hideOverlay();
      }).catch(function (err) {
        gyro.permission = 'error: ' + (err && err.message ? err.message : 'unknown');
        hideOverlay();
      });
    } else {
      gyro.permission = (typeof DeviceOrientationEvent === 'undefined') ? 'no-api' : 'granted';
      attachOrientationListener();
      hideOverlay();
    }
  });

  // ---------- Pointer-drag fallback for desktop testing ----------
  let dragging = false, dragStartX = 0, dragStartY = 0;
  renderer.domElement.addEventListener('pointerdown', function (e) {
    dragging = true; dragStartX = e.clientX; dragStartY = e.clientY;
  });
  renderer.domElement.addEventListener('pointermove', function (e) {
    if (!dragging) return;
    const dx = (e.clientX - dragStartX) / window.innerWidth;
    const dy = (e.clientY - dragStartY) / window.innerHeight;
    const tx = Math.max(-1, Math.min(1, dx * 2));
    const tz = Math.max(-1, Math.min(1, dy * 2));
    gravityTarget.set(tx, -1.0, tz).normalize().multiplyScalar(GRAVITY_MAG);
  });
  function endDrag() {
    if (!dragging) return;
    dragging = false;
    gravityTarget.set(0, -1, 0).multiplyScalar(GRAVITY_MAG);
  }
  renderer.domElement.addEventListener('pointerup', endDrag);
  renderer.domElement.addEventListener('pointercancel', endDrag);

  // ---------- Pointer-drag fallback DISABLED in v11 ----------
  // No input is attached to the canvas. gravityTarget stays at (0, -G, 0).
  const canvas = renderer.domElement;
  // Prevent default touch behaviors on canvas (extra safety on iOS).
  canvas.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });

  // ---------- Resize / orientation change ----------
  function onResize() {
    const w = window.innerWidth;
    const h = window.innerHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, PIXEL_RATIO_CAP));
    renderer.setSize(w, h);
  }
  window.addEventListener('resize', onResize);
  window.addEventListener('orientationchange', onResize);
  if (screen.orientation && screen.orientation.addEventListener) {
    screen.orientation.addEventListener('change', onResize);
  }

  // ---------- FPS + gyro debug overlays ----------
  const fpsEl = document.getElementById('fps');
  const debugTextEl = document.getElementById('debug-text');
  const copyBtn = document.getElementById('copy-btn');
  let fpsAccum = 0, fpsFrames = 0, fpsTimer = 0;
  let debugTimer = 0;
  let lastFps = 0;
  function formatNum(v, w) {
    const s = (v >= 0 ? ' ' : '') + v.toFixed(2);
    return s.padStart(w || 6, ' ');
  }
  function buildDebugText() {
    const age = gyro.lastEventTime
      ? ((performance.now() - gyro.lastEventTime) / 1000).toFixed(1) + 's ago'
      : 'never';
    return (
      'gyro: ' + gyro.permission +
      '  events: ' + gyro.eventCount +
      '  last: ' + age + '\n' +
      'β: ' + formatNum(gyro.lastBeta) +
      '  γ: ' + formatNum(gyro.lastGamma) + '\n' +
      'gravity   x:' + formatNum(gravity.x) +
      ' y:' + formatNum(gravity.y) +
      ' z:' + formatNum(gravity.z) + '\n' +
      'target    x:' + formatNum(gravityTarget.x) +
      ' y:' + formatNum(gravityTarget.y) +
      ' z:' + formatNum(gravityTarget.z)
    );
  }
  function updateDebug() {
    debugTextEl.textContent = buildDebugText();
  }
  // ---------- On-device sanity check ----------
  // Run a fresh sim with the EXACT same setup as the live one and report
  // peak max|h| over 200 steps. In Node this peaks at ~0.115 then decays.
  // If the iPhone reports something wildly different, the bug is below
  // sim.js (JS engine, Float32Array semantics, etc).
  const _selfTest = (function () {
    const f2 = new HeightField(GRID_N, {
      boxSize: BOX_SIZE,
      waveC: WAVE_C,
      velDamping: VEL_DAMPING,
      ampDamping: AMP_DAMPING,
      tiltStiffness: TILT_STIFFNESS,
      minVerticalG: MIN_VERTICAL_G,
      maxEqAmp: MAX_EQ_AMP
    });
    f2.pokeGaussian(GRID_N >> 1, GRID_N >> 1, 0.12, 3.5);
    f2.pokeGaussian((GRID_N >> 1) - 10, (GRID_N >> 1) + 8, 0.07, 3.0);
    f2.pokeGaussian((GRID_N >> 1) + 12, (GRID_N >> 1) - 6, 0.07, 3.0);
    f2.startAtRest();
    let peak = 0;
    for (let s = 0; s < 200; s++) {
      f2.step(1 / 60, 0, -9.8, 0);
      const m = f2.maxAbsHeight();
      if (m > peak) peak = m;
    }
    let final = f2.maxAbsHeight();
    let finalAdj = 0;
    for (let j = 1; j < f2.n - 1; j++) {
      for (let i = 1; i < f2.n - 2; i++) {
        const k = j * f2.n + i;
        const d = Math.abs(f2.h[k] - f2.h[k + 1]);
        if (d > finalAdj) finalAdj = d;
      }
    }
    return { peak: peak, final: final, finalAdj: finalAdj };
  })();

  // Snapshot the live field's initial seed amplitude for comparison.
  const _liveInitialMaxH = field.maxAbsHeight();

  // Time-series of max|h| sampled every 0.5s. Lets us see exactly when the
  // simulation transitions from calm to explosive on the device.
  const TIMELINE_INTERVAL = 0.5;
  const TIMELINE_LEN = 30; // last 15 seconds
  const timeline = [];
  let timelineTimer = 0;
  const startWallTime = performance.now();
  let stepsRun = 0;
  // Per-step max|h| trace: stops growing once explosion is captured so we
  // preserve the lead-up.
  const STEP_TRACE_LEN = 100;
  const stepTrace = [];
  let stepTraceFrozen = false;
  // Capture a snapshot the FIRST time max|h| crosses the explosion threshold.
  let lastFrameMaxH = 0;
  let explosion = null;
  function captureExplosionSnapshot() {
    const N = field.n;
    const h = field.h;
    const hp = field.hPrev;
    const halfN = (N - 1) / 2;
    // Sample row j = N/2 across i (every 4th cell), and column i = N/2 across j.
    const rowH = [], rowHp = [];
    for (let i = 0; i < N; i += 4) {
      rowH.push(h[(N >> 1) * N + i]);
      rowHp.push(hp[(N >> 1) * N + i]);
    }
    const colH = [];
    for (let j = 0; j < N; j += 4) colH.push(h[j * N + (N >> 1)]);
    // Adjacent-cell histogram: count how many adjacent pairs are >0.3 apart.
    let bigJumps = 0, totalPairs = 0;
    for (let j = 0; j < N; j++) {
      for (let i = 0; i < N - 1; i++) {
        totalPairs++;
        if (Math.abs(h[j * N + i] - h[j * N + i + 1]) > 0.3) bigJumps++;
      }
    }
    return {
      t: ((performance.now() - startWallTime) / 1000),
      stepsRun: stepsRun,
      maxH: field.maxAbsHeight(),
      rowH: rowH.map(function (v) { return v.toFixed(3); }),
      rowHp: rowHp.map(function (v) { return v.toFixed(3); }),
      colH: colH.map(function (v) { return v.toFixed(3); }),
      bigJumps: bigJumps,
      totalPairs: totalPairs
    };
  }
  function pushTimeline() {
    let madj = 0;
    const N = field.n;
    const h = field.h;
    for (let j = 1; j < N - 1; j++) {
      for (let i = 1; i < N - 2; i++) {
        const k = j * N + i;
        const d = Math.abs(h[k] - h[k + 1]);
        if (d > madj) madj = d;
      }
    }
    timeline.push({
      t: ((performance.now() - startWallTime) / 1000),
      maxH: field.maxAbsHeight(),
      maxAdj: madj
    });
    while (timeline.length > TIMELINE_LEN) timeline.shift();
  }

  function buildFullReport() {
    // Sim health snapshot.
    let maxH = 0, sumSq = 0, nans = 0, edgeMaxAbsDiff = 0;
    const h = field.h;
    for (let k = 0; k < h.length; k++) {
      if (!isFinite(h[k])) nans++;
      else {
        const a = Math.abs(h[k]);
        if (a > maxH) maxH = a;
        sumSq += h[k] * h[k];
      }
    }
    // Largest height jump between any two adjacent cells (high-freq indicator).
    const N = field.n;
    let maxAdjDiff = 0;
    for (let j = 1; j < N - 1; j++) {
      for (let i = 1; i < N - 2; i++) {
        const k = j * N + i;
        const d1 = Math.abs(h[k] - h[k + 1]);
        if (d1 > maxAdjDiff) maxAdjDiff = d1;
        const d2 = Math.abs(h[k] - h[k + N]);
        if (d2 > maxAdjDiff) maxAdjDiff = d2;
      }
    }
    // Particle count alive.
    let alive = 0;
    for (let p = 0; p < particles.length; p++) if (particles[p].alive) alive++;
    return [
      '=== Water Box debug report ===',
      'version:    ' + APP_VERSION,
      'sim:        ' + (typeof SIM_VERSION !== 'undefined' ? SIM_VERSION : 'UNKNOWN (stale sim.js cached!)'),
      'time:       ' + new Date().toISOString(),
      'fps:        ' + lastFps.toFixed(1),
      '',
      '-- gyro --',
      'permission: ' + gyro.permission,
      'events:     ' + gyro.eventCount,
      'last evt:   ' + (gyro.lastEventTime
        ? ((performance.now() - gyro.lastEventTime) / 1000).toFixed(2) + 's ago'
        : 'never'),
      'beta:       ' + gyro.lastBeta.toFixed(3),
      'gamma:      ' + gyro.lastGamma.toFixed(3),
      'screen.orientation.angle: ' +
        ((screen.orientation && typeof screen.orientation.angle === 'number')
          ? screen.orientation.angle
          : 'n/a'),
      'window.orientation: ' +
        (typeof window.orientation === 'number' ? window.orientation : 'n/a'),
      '',
      '-- gravity --',
      'gravity x:  ' + gravity.x.toFixed(3),
      'gravity y:  ' + gravity.y.toFixed(3),
      'gravity z:  ' + gravity.z.toFixed(3),
      'target  x:  ' + gravityTarget.x.toFixed(3),
      'target  y:  ' + gravityTarget.y.toFixed(3),
      'target  z:  ' + gravityTarget.z.toFixed(3),
      '',
      '-- sim health --',
      'grid:           ' + N + 'x' + N,
      'max |h|:        ' + maxH.toFixed(4) + '  (clamp at ' + field.hmax + ')',
      'sum h^2:        ' + sumSq.toFixed(4),
      'NaN cells:      ' + nans,
      'max adj diff:   ' + maxAdjDiff.toFixed(4) + '  (high-freq indicator)',
      'alive splashes: ' + alive + ' / ' + particles.length,
      '',
      '-- on-device sanity (fresh sim, 200 steps, gravity straight down) --',
      'expected (Node): peak~0.115, final~0, finalAdj~0',
      'observed:        peak ' + _selfTest.peak.toFixed(4) +
        ', final ' + _selfTest.final.toFixed(4) +
        ', finalAdj ' + _selfTest.finalAdj.toFixed(4),
      'live initial max|h|: ' + _liveInitialMaxH.toFixed(4) + '  (expected ~0.12)',
      '',
      '-- live timeline (sampled every ' + TIMELINE_INTERVAL + 's, last ' + (TIMELINE_LEN * TIMELINE_INTERVAL) + 's) --',
      'steps run total: ' + stepsRun,
      timeline.length === 0 ? '(no samples yet)' :
        timeline.map(function (s) {
          return '  t=' + s.t.toFixed(1).padStart(5, ' ') +
                 's  max|h|=' + s.maxH.toFixed(4) +
                 '  maxAdj=' + s.maxAdj.toFixed(4);
        }).join('\n'),
      '',
      '-- per-step max|h| trace (last ' + STEP_TRACE_LEN + ' steps, freezes on explosion) --',
      stepTrace.length === 0 ? '(no steps yet)' :
        '[' + stepTrace.map(function (v) { return v.toFixed(4); }).join(', ') + ']',
      '',
      '-- explosion snapshot (first frame max|h| crossed 0.3) --',
      explosion === null ? '(no explosion detected yet — sim is calm)' : [
        'when:        t=' + explosion.t.toFixed(3) + 's  step #' + explosion.stepsRun,
        'max|h|:      ' + explosion.maxH.toFixed(4),
        'big jumps:   ' + explosion.bigJumps + ' / ' + explosion.totalPairs +
          ' pairs differ by >0.3 (checkerboard fingerprint)',
        'row j=N/2 h:  [' + explosion.rowH.join(', ') + ']',
        'row j=N/2 hp: [' + explosion.rowHp.join(', ') + ']',
        'col i=N/2 h:  [' + explosion.colH.join(', ') + ']'
      ].join('\n'),
      '',
      '-- unit tests (run on load) --',
      (function () {
        const r = window.__TEST_RESULTS__ || [];
        if (!r.length) return 'tests not loaded';
        let p = 0, f = 0;
        const fails = [];
        for (const t of r) {
          if (t.pass) p++;
          else { f++; fails.push('  FAIL ' + t.name + ' — ' + t.msg); }
        }
        return p + ' passed, ' + f + ' failed' + (fails.length ? '\n' + fails.join('\n') : '');
      })(),
      '',
      '-- environment --',
      'window:        ' + window.innerWidth + 'x' + window.innerHeight,
      'devicePixelRatio: ' + (window.devicePixelRatio || 1),
      'WebGL:         ' + (renderer.capabilities && renderer.capabilities.isWebGL2 ? 'WebGL2' : 'WebGL1'),
      'userAgent:     ' + navigator.userAgent
    ].join('\n');
  }
  document.getElementById('reset-btn').addEventListener('click', function () {
    // Re-seed the live field from a clean state.
    field.h.fill(0);
    field.hPrev.fill(0);
    if (field._scratch) field._scratch.fill(0);
    field.pokeGaussian(GRID_N >> 1, GRID_N >> 1, 0.12, 3.5);
    field.pokeGaussian((GRID_N >> 1) - 10, (GRID_N >> 1) + 8, 0.07, 3.0);
    field.pokeGaussian((GRID_N >> 1) + 12, (GRID_N >> 1) - 6, 0.07, 3.0);
    field.startAtRest();
    timeline.length = 0;
    timelineTimer = 0;
    stepsRun = 0;
    lastFrameMaxH = 0;
    explosion = null;
    stepTrace.length = 0;
    stepTraceFrozen = false;
  });

  copyBtn.addEventListener('click', function () {
    const text = buildFullReport();
    function showCopied() {
      copyBtn.textContent = 'Copied! ✓';
      copyBtn.classList.add('copied');
      setTimeout(function () {
        copyBtn.textContent = 'Copy debug info';
        copyBtn.classList.remove('copied');
      }, 1500);
    }
    function fallback() {
      // Legacy fallback: a textarea + execCommand. Still works in iOS Safari
      // when navigator.clipboard isn't available or fails.
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.top = '0';
      ta.style.left = '0';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      let ok = false;
      try { ok = document.execCommand('copy'); } catch (_) {}
      document.body.removeChild(ta);
      if (ok) showCopied();
      else {
        copyBtn.textContent = 'Copy failed — long-press text';
        setTimeout(function () {
          copyBtn.textContent = 'Copy debug info';
        }, 2000);
      }
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(showCopied, fallback);
    } else {
      fallback();
    }
  });

  // ---------- Main loop ----------
  let lastT = performance.now() / 1000;
  function loop() {
    requestAnimationFrame(loop);

    const nowT = performance.now() / 1000;
    let dt = nowT - lastT;
    lastT = nowT;

    if (document.hidden) return;
    if (dt > DT_CLAMP_MAX) dt = DT_CLAMP_MAX;
    if (dt < DT_CLAMP_MIN) dt = DT_CLAMP_MIN;

    // Smoothly approach gravity target.
    gravity.lerp(gravityTarget, 0.15);

    // v23: water plane rotates to follow gravity, so the height-field sim
    // runs in the plane's local frame where gravity is always 'down' from
    // its perspective. Pass a constant local gravity into the sim.
    updateWaterMeshOrientation();    // computes _planeNormal for splash math
    injectAmbientRipple();
    injectRotationWaves();

    // Step physics with a fixed substep for stability.
    let acc = dt;
    let safety = 8;
    while (acc > 0 && safety-- > 0) {
      const step = Math.min(FIXED_DT, acc);
      field.step(step, 0, -GRAVITY_MAG, 0);
      stepsRun++;
      stepParticles(step, gravity);
      // Per-step trace: max|h| right after each physics step.
      if (!stepTraceFrozen) {
        const m = field.maxAbsHeight();
        stepTrace.push(m);
        while (stepTrace.length > STEP_TRACE_LEN) stepTrace.shift();
        if (m >= 0.3) stepTraceFrozen = true;
      }
      acc -= step;
    }

    spawnSplashParticles(gravity);
    syncWaterMesh();

    renderer.render(scene, camera);

    // FPS readout.
    fpsAccum += dt; fpsFrames++; fpsTimer += dt;
    if (fpsTimer > 0.5) {
      lastFps = fpsFrames / fpsAccum;
      fpsEl.textContent = lastFps.toFixed(0) + ' fps';
      fpsAccum = 0; fpsFrames = 0; fpsTimer = 0;
    }

    // Debug panel ~5 Hz to keep it readable.
    debugTimer += dt;
    if (debugTimer > 0.2) { updateDebug(); debugTimer = 0; }

    // Timeline sampler.
    timelineTimer += dt;
    if (timelineTimer > TIMELINE_INTERVAL) { pushTimeline(); timelineTimer = 0; }

    // Explosion detector: snapshot the FIRST frame max|h| crosses 0.3.
    const curMaxH = field.maxAbsHeight();
    if (!explosion && lastFrameMaxH < 0.3 && curMaxH >= 0.3) {
      explosion = captureExplosionSnapshot();
    }
    lastFrameMaxH = curMaxH;
  }
  loop();
})();
</script>
</body>
</html>
